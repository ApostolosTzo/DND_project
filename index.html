<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DND Terminal</title>
    <meta name="description" content="A browser-based Dungeons &amp; Dragons-style RPG with world map, dungeon crawling and turn-based combat.">
    <meta name="theme-color" content="#0b0b0c">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DND Terminal">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b0c;
            color: #d6d6d6;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #app {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        header {
            text-align: center;
            padding: 15px;
            border-bottom: 2px solid #c9a84c;
            margin-bottom: 20px;
        }
        header h1 { color: #c9a84c; font-size: 1.4em; letter-spacing: 3px; }
        #main {
            display: flex;
            gap: 20px;
            flex: 1;
        }
        #left {
            flex: 2;
            display: flex;
            flex-direction: column;
        }
        #right {
            flex: 1;
            background: #151517;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.85em;
            min-width: 220px;
        }
        #right h3 { color: #c9a84c; font-size: 0.9em; margin-bottom: 8px; border-bottom: 1px solid #2e2e33; padding-bottom: 4px; }
        #right p { margin: 4px 0; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
        #right .stat { color: #9a9aa0; }
        #right .val  { color: #d6d6d6; text-align: right; }
        #screen-title {
            color: #c9a84c;
            font-size: 1.2em;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #2e2e33;
        }
        #screen-body {
            white-space: pre-wrap;
            font-size: 0.9em;
            margin-bottom: 15px;
            line-height: 1.5;
            padding: 10px;
            background: #151517;
            border-radius: 6px;
            min-height: 80px;
        }
        #options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #options button {
            background: #1e1e21;
            color: #d6d6d6;
            border: 1px solid #2e2e33;
            padding: 12px 16px;
            min-height: 46px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            cursor: pointer;
            text-align: left;
            border-radius: 4px;
            transition: 0.2s;
            touch-action: manipulation;
        }
        #options button:hover { background: #2a2a2e; border-color: #c9a84c; }
        #options button:active { background: #242428; }
        #options button.selected {
            border-color: #c9a84c;
            background: #2a2a2e;
            box-shadow: inset 4px 0 0 #c9a84c;
        }
        /* ---------- Shop: inline item panel ---------- */
        #options.shop { gap: 4px; }
        .shop-gold {
            color: #c9a84c; font-size: 0.85em; padding: 2px 4px 8px;
            border-bottom: 1px solid #2e2e33; margin-bottom: 6px;
        }
        .shop-row { display: flex; flex-direction: column; }
        .shop-item { width: 100%; }
        .shop-detail {
            background: #151517;
            border: 1px solid #2e2e33;
            border-left: 3px solid #c9a84c;
            border-radius: 0 6px 6px 0;
            padding: 12px 14px;
            margin: -2px 0 6px 4px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .shop-detail-info { flex: 1; min-width: 150px; }
        .shop-detail-name { color: #c9a84c; margin-bottom: 6px; }
        .shop-detail dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
        .shop-detail dt { color: #8a8a8a; font-size: 0.85em; }
        .shop-detail dd { margin: 0; color: #d6d6d6; font-size: 0.85em; }
        .shop-detail .good { color: #5fd39a; }
        .shop-detail .flavour { color: #8a8a8a; font-size: 0.8em; margin: 6px 0 0; }
        .shop-buy {
            background: #c9a84c; color: #0b0b0c; border: none;
            padding: 10px 22px; font-family: 'Courier New', monospace; font-size: 0.95em;
            cursor: pointer; border-radius: 4px; min-height: 42px;
            transition: 0.2s; touch-action: manipulation;
            align-self: flex-end;
        }
        .shop-buy:hover { background: #dbb95c; }
        .shop-buy:disabled { background: #2e2e33; color: #8a8a8a; cursor: not-allowed; }
        .hint { color: #6a6a70; font-size: 0.72em; margin-top: 8px; text-align: right; }
        #log {
            margin-top: 15px;
            padding: 10px;
            background: #0e0e0f;
            border-radius: 6px;
            font-size: 0.8em;
            color: #8a8a8a;
            min-height: 40px;
            max-height: 100px;
            overflow-y: auto;
        }
        #log p { margin: 2px 0; }
        #log p:first-child { color: #d6d6d6; }
        #map-container {
            margin-top: 15px;
            background: #151517;
            border-radius: 6px;
            padding: 8px;
            width: 100%;
        }
        #map-container svg {
            width: 100%;
            height: auto;
            display: block;
        }
        #create-form { display: flex; flex-direction: column; gap: 12px; padding: 10px 0; }
        #create-form label { color: #9a9aa0; font-size: 0.9em; }
        #create-form input, #create-form select {
            background: #1e1e21; color: #d6d6d6; border: 1px solid #2e2e33;
            padding: 8px 10px; font-family: 'Courier New', monospace; font-size: 0.95em;
            border-radius: 4px; width: 100%;
        }
        #create-form select option { background: #151517; }
        #create-form button {
            background: #c9a84c; color: #0b0b0c; border: none;
            padding: 10px; font-size: 1em; cursor: pointer;
            border-radius: 4px; font-family: 'Courier New', monospace; margin-top: 6px;
        }
        #create-form button:hover { background: #dbb95c; }
        #info-box {
            background: #1e1e21; border: 1px solid #2e2e33; border-radius: 6px;
            padding: 10px; margin-top: 6px; font-size: 0.85em; min-height: 40px;
        }
        #info-box .label { color: #9a9aa0; }
        #info-box .value { color: #d6d6d6; float: right; }
        #hp-bar {
            background: #2e2e33; height: 8px; border-radius: 4px; margin: 6px 0; overflow: hidden;
        }
        #hp-bar div { background: #2fbf71; height: 100%; transition: width 0.3s; }
        #xp-bar {
            background: #2e2e33; height: 6px; border-radius: 3px; margin: 4px 0; overflow: hidden;
        }
        #xp-bar div { background: #c9a84c; height: 100%; transition: width 0.3s; }
        #buy-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center;
        }
        #buy-box {
            background: #151517; padding: 25px; border-radius: 10px;
            border: 1px solid #c9a84c; text-align: center;
            width: 100%; max-width: 92vw;
        }
        #buy-box h3 { color: #c9a84c; margin-bottom: 15px; }
        #buy-box input {
            background: #1e1e21; color: #d6d6d6; border: 1px solid #2e2e33;
            padding: 8px; font-size: 1.1em; width: 80px; text-align: center;
            border-radius: 4px; font-family: 'Courier New', monospace;
        }
        #buy-box button {
            background: #c9a84c; color: #0b0b0c; border: none; padding: 8px 20px;
            margin: 5px; font-size: 0.95em; cursor: pointer; border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        #buy-box button:hover { background: #dbb95c; }

        /* ---------- Safe area (standalone / notched phones) ---------- */
        body { padding-bottom: env(safe-area-inset-bottom); }

        /* ---------- Combat stage: monster portrait ---------- */
        #combat-stage {
            display: none;
            background: #151517;
            border: 1px solid #2e2e33;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 15px;
        }
        #combat-stage.on { display: block; }
        .monster {
            --dmg: 0;
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .monster-art {
            flex: 0 0 auto;
            width: 120px; height: 120px;
            display: grid; place-items: center;
        }
        /* The more damage it has taken, the more twisted and washed out it looks. */
        .monster svg {
            width: 120px; height: 120px; display: block;
            transform:
                rotate(calc(var(--dmg) * 7deg))
                skewX(calc(var(--dmg) * 8deg))
                scale(calc(1 - var(--dmg) * 0.05));
            filter:
                blur(calc(var(--dmg) * 1.3px))
                saturate(calc(1 - var(--dmg) * 0.45))
                hue-rotate(calc(var(--dmg) * 55deg));
            transition: transform .25s ease, filter .25s ease;
        }
        .monster-art.hit { animation: monster-hit .45s ease-out; }
        @keyframes monster-hit {
            0%   { transform: translate(0,0) rotate(0deg); filter: brightness(1); }
            15%  { transform: translate(-11px,4px) rotate(-11deg); filter: brightness(1.9); }
            30%  { transform: translate(10px,-4px) rotate(9deg); filter: brightness(1.25); }
            45%  { transform: translate(-7px,3px) rotate(-6deg); }
            60%  { transform: translate(6px,1px) rotate(5deg); }
            80%  { transform: translate(-3px,0) rotate(-2deg); }
            100% { transform: translate(0,0) rotate(0deg); filter: brightness(1); }
        }
        .monster-info { flex: 1; min-width: 0; }
        .monster-name { color: #e74c3c; font-size: 1.05em; letter-spacing: 1px; margin-bottom: 8px; }
        #ehp-bar { background: #2a2a2a; height: 12px; border-radius: 6px; overflow: hidden; }
        #ehp-fill {
            background: linear-gradient(90deg, #c0392b, #e74c3c);
            height: 100%; transition: width .3s;
        }
        .monster-hp { color: #9a9aa0; font-size: .8em; margin-top: 6px; }

        /* ---------- Combat / dungeon focus: hide the map, grow the chat ---------- */
        #log { min-height: 40px; max-height: 170px; }
        body.in-combat #map-container { display: none; }
        body.in-combat #log { flex: 1; max-height: none; min-height: 130px; }

        /* ---------- Responsive: phones ---------- */
        @media (max-width: 760px) {
            #app { padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
            header { padding: 10px 4px; margin-bottom: 14px; }
            header h1 { font-size: 1.05em; letter-spacing: 1px; }
            #main { flex-direction: column; gap: 14px; }
            #right {
                order: -1;
                min-width: 0; width: 100%;
                display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 14px;
                padding: 12px;
            }
            #right h3 { grid-column: 1 / -1; }
            #screen-title { font-size: 1.05em; margin-bottom: 8px; }
            #screen-body { font-size: 0.95em; min-height: 60px; }
            #options button { font-size: 1em; padding: 14px; }
            #create-form input, #create-form select, #create-form button { font-size: 1em; padding: 12px; }
            #buy-box { padding: 20px; }
            #combat-stage { padding: 10px; }
            .monster { gap: 12px; }
            .monster-art, .monster svg { width: 92px; height: 92px; }
            .monster-name { font-size: .95em; }
            #log { font-size: 0.82em; }
            .hint { display: none; }
        }
        @media (max-width: 400px) {
            .monster { flex-direction: column; text-align: center; }
            .monster-art, .monster svg { width: 84px; height: 84px; }
        }
        @media (min-width: 1100px) {
            #app { max-width: 1100px; }
        }
    </style>
</head>
<body>
<div id="app">
    <header><h1>⚔ DUNGEONS & DRAGONS ⚔</h1></header>
    <div id="main">
        <div id="left">
            <div id="screen-title"></div>
            <div id="combat-stage"></div>
            <div id="screen-body"></div>
            <div id="options"></div>
            <div class="hint">1-9 or ↑/↓ + Enter</div>
            <div id="log"></div>
            <div id="map-container"></div>
        </div>
        <div id="right">
            <h3>Player</h3>
            <p><span class="stat">Name</span> <span class="val" id="p-name">-</span></p>
            <p><span class="stat">Class</span> <span class="val" id="p-class">-</span></p>
            <p><span class="stat">Level</span> <span class="val" id="p-level">-</span></p>
            <p><span class="stat">HP</span> <span class="val" id="p-hp">-/-</span></p>
            <div id="hp-bar"><div id="hp-fill"></div></div>
            <p><span class="stat">AC</span> <span class="val" id="p-ac">-</span></p>
            <p><span class="stat">Gold</span> <span class="val" id="p-gold">-</span></p>
            <p><span class="stat">XP</span> <span class="val" id="p-xp">-</span></p>
            <div id="xp-bar"><div id="xp-fill"></div></div>
            <p><span class="stat">Weapon</span> <span class="val" id="p-weapon">-</span></p>
            <p><span class="stat">Armor</span> <span class="val" id="p-armor">-</span></p>
        </div>
    </div>
</div>

<div id="buy-overlay">
    <div id="buy-box">
        <h3 id="buy-title">Buy</h3>
        <p id="buy-info" style="margin-bottom:12px;color:#8a8a8a;"></p>
        <div><input type="number" id="buy-qty" value="1" min="1"></div>
        <div style="margin-top:12px;">
            <button onclick="buyConfirm()">Buy</button>
            <button onclick="hideBuy()">Cancel</button>
        </div>
    </div>
</div>

<script src="js/dice.js"></script>
<script src="js/items.js"></script>
<script src="js/enemy.js"></script>
<script src="js/player.js"></script>
<script src="js/shop.js"></script>
<script src="js/world_map.js"></script>
<script src="js/saves.js"></script>
<script src="js/game.js"></script>
<script>
let currentState = null;
let buyItemName = null;
let raceData = [];
let classData = [];
let mapLocations = null;


function loadMapData() {
    mapLocations = Game.mapData().locations;
}

function travel(id) {
    render(Game.travel(id));
}

function roadPath(a, b) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const dx = b.x - a.x, dy = b.y - a.y;
    return "M " + a.x + " " + a.y + " Q " + (mx - dy * 0.16) + " " + (my + dx * 0.16) + " " + b.x + " " + b.y;
}

function tree(x, y, s, op) {
    return '<g opacity="' + op + '">' +
        '<rect x="' + (x - 1.4) + '" y="' + (y - 3) + '" width="2.8" height="7" fill="#3a2f1f"/>' +
        '<path d="M ' + x + ' ' + (y - 20 * s) + ' L ' + (x + 9 * s) + ' ' + (y - 1) + ' L ' + (x - 9 * s) + ' ' + (y - 1) + ' Z" fill="#20402e"/>' +
        '<path d="M ' + x + ' ' + (y - 20 * s) + ' L ' + (x + 9 * s) + ' ' + (y - 1) + ' L ' + x + ' ' + (y - 1) + ' Z" fill="#2b5741"/></g>';
}

function mountain(x, y, s, op) {
    return '<g opacity="' + op + '">' +
        '<path d="M ' + (x - 22 * s) + ' ' + y + ' L ' + x + ' ' + (y - 30 * s) + ' L ' + (x + 22 * s) + ' ' + y + ' Z" fill="#242430"/>' +
        '<path d="M ' + (x - 7 * s) + ' ' + (y - 16 * s) + ' L ' + x + ' ' + (y - 30 * s) + ' L ' + (x + 7 * s) + ' ' + (y - 16 * s) + ' Z" fill="#d8d8d6" opacity=".75"/></g>';
}

function nodeGlyph(type) {
    if (type === "town") {
        return '<g fill="#0b0b0c">' +
            '<rect x="-8" y="-4" width="5.5" height="10"/>' +
            '<rect x="2.5" y="-4" width="5.5" height="10"/>' +
            '<rect x="-3" y="-1" width="6" height="7"/>' +
            '<rect x="-9.5" y="-7" width="2" height="3"/><rect x="-6.5" y="-7" width="2" height="3"/>' +
            '<rect x="1.5" y="-7" width="2" height="3"/><rect x="4.5" y="-7" width="2" height="3"/></g>';
    }
    if (type === "village") {
        return '<g fill="#0b0b0c">' +
            '<path d="M 0 -8 L 8 0 L -8 0 Z"/>' +
            '<rect x="-5" y="0" width="10" height="6"/>' +
            '<rect x="-1.4" y="2" width="2.8" height="4" fill="#2fbf71"/></g>';
    }
    return '<g><path d="M -7 6 v-7 a7 7 0 0 1 14 0 v7 Z" fill="#0b0b0c"/>' +
        '<circle cx="-2.6" cy="0" r="1.5" fill="#e74c3c"/><circle cx="2.6" cy="0" r="1.5" fill="#e74c3c"/></g>';
}

function drawMap(currentId) {
    const container = document.getElementById("map-container");
    if (!mapLocations || !currentId || !mapLocations[currentId]) {
        container.innerHTML = "";
        return;
    }
    const locs = mapLocations;
    const current = locs[currentId];
    const FILL = { town: "#c9a84c", village: "#2fbf71", dungeon: "#c0392b" };
    const STROKE = { town: "#dbb95c", village: "#5fd39a", dungeon: "#e74c3c" };
    const reachable = (id) => id === currentId || current.connects_to.indexOf(id) !== -1;

    let svg = '<svg viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="World map">';
    svg += "<style>" +
        ".mn{transition:transform .18s ease;transform-box:fill-box;transform-origin:center}" +
        ".mn:hover{transform:scale(1.18)}" +
        ".mlabel{font-family:'Courier New',monospace;font-size:11px}" +
        "</style>";
    svg += '<defs>' +
        '<linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">' +
            '<stop offset="0" stop-color="#0d0d10"/><stop offset="1" stop-color="#17171c"/></linearGradient>' +
        '<radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">' +
            '<stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>' +
        '<filter id="glow" x="-70%" y="-70%" width="240%" height="240%">' +
            '<feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
        "</defs>";

    svg += '<rect width="520" height="360" fill="url(#sky)" rx="6"/>';

    // --- scenery: hills, forest, river, mountains ---
    svg += '<g opacity="0.5">' +
        '<ellipse cx="150" cy="250" rx="130" ry="60" fill="#151a16"/>' +
        '<ellipse cx="400" cy="120" rx="150" ry="70" fill="#151a16"/>' +
        '<ellipse cx="470" cy="330" rx="120" ry="50" fill="#1c1418"/></g>';

    svg += '<path d="M -12 58 C 70 92, 120 128, 176 196 S 268 292, 352 322 S 470 348, 540 332" ' +
        'stroke="#123b39" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.55"/>' +
        '<path d="M -12 58 C 70 92, 120 128, 176 196 S 268 292, 352 322 S 470 348, 540 332" ' +
        'stroke="#2fbf71" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.28"/>';

    svg += '<g>' +
        tree(300, 300, 0.85, 0.9) + tree(318, 314, 0.7, 0.8) + tree(286, 318, 0.75, 0.8) +
        tree(352, 262, 0.6, 0.7) + tree(268, 268, 0.55, 0.65) +
        tree(402, 92, 0.8, 0.85) + tree(428, 76, 0.65, 0.75) + tree(446, 104, 0.7, 0.8) +
        tree(140, 300, 0.7, 0.7) + tree(120, 258, 0.6, 0.6) +
        "</g>";

    svg += '<g>' +
        mountain(486, 300, 1, 0.95) + mountain(444, 322, 0.75, 0.85) + mountain(516, 286, 0.7, 0.8) +
        mountain(462, 250, 0.55, 0.6) +
        "</g>";

    // --- roads ---
    const drawn = new Set();
    for (const [id, loc] of Object.entries(locs)) {
        for (const target of loc.connects_to) {
            const key = [id, target].sort().join("-");
            if (drawn.has(key)) continue;
            drawn.add(key);
            const t = locs[target];
            if (!t) continue;
            const on = reachable(id) && reachable(target);
            const op = on ? 1 : 0.3;
            svg += '<path d="' + roadPath(loc, t) + '" stroke="#0b0b0c" stroke-width="8" fill="none" opacity="' + (op * 0.7) + '" stroke-linecap="round"/>';
            svg += '<path d="' + roadPath(loc, t) + '" stroke="#c9a84c" stroke-width="2.5" fill="none" opacity="' + op +
                '" stroke-dasharray="2 7" stroke-linecap="round"/>';
        }
    }

    // --- nodes ---
    for (const [id, loc] of Object.entries(locs)) {
        const isCurrent = id === currentId;
        const canReach = reachable(id);
        const op = canReach ? 1 : 0.32;
        const r = isCurrent ? 11 : 9;
        const fill = FILL[loc.type] || "#8a8a8a";
        const stroke = STROKE[loc.type] || "#8a8a8a";
        const labelY = loc.y < 200 ? loc.y - 20 : loc.y + 26;
        const pillW = loc.name.length * 6.7 + 14;

        if (isCurrent) {
            svg += '<circle cx="' + loc.x + '" cy="' + loc.y + '" r="18" fill="none" stroke="' + fill + '" stroke-width="2" opacity="0.45">' +
                '<animate attributeName="r" values="12;20;12" dur="2.4s" repeatCount="indefinite"/>' +
                '<animate attributeName="opacity" values="0.45;0.05;0.45" dur="2.4s" repeatCount="indefinite"/></circle>';
        }

        // generous invisible hit area, easy to tap on a phone
        if (canReach && !isCurrent) {
            svg += '<circle cx="' + loc.x + '" cy="' + loc.y + '" r="' + (r + 12) + '" fill="transparent" style="cursor:pointer" ' +
                'onclick="travel(\'' + id + '\')"><title>Travel to ' + loc.name + "</title></circle>";
        }

        svg += '<g class="mn" opacity="' + op + '">';
        if (isCurrent) svg += '<circle cx="' + loc.x + '" cy="' + loc.y + '" r="' + (r + 4) + '" fill="' + fill + '" opacity="0.18"/>';
        svg += '<circle cx="' + loc.x + '" cy="' + loc.y + '" r="' + r + '" fill="' + fill + '" stroke="' + stroke +
            '" stroke-width="2"' + (isCurrent ? ' filter="url(#glow)"' : "") + "/>";
        svg += '<g transform="translate(' + loc.x + ',' + (loc.y + 0.5) + ') scale(0.62)">' + nodeGlyph(loc.type) + "</g>";
        svg += '<rect x="' + (loc.x - pillW / 2) + '" y="' + (labelY - 11) + '" width="' + pillW + '" height="16" rx="8" fill="#0b0b0c" opacity="0.82"/>';
        svg += '<text class="mlabel" x="' + loc.x + '" y="' + labelY + '" text-anchor="middle" fill="' + stroke + '" opacity="' + op + '">' + loc.name + "</text>";
        svg += "</g>";
    }

    svg += '<rect width="520" height="360" fill="url(#vig)" pointer-events="none" rx="6"/>';

    // --- caption + legend ---
    svg += '<g><rect x="10" y="10" width="182" height="40" rx="6" fill="#0b0b0c" opacity="0.8"/>' +
        '<text x="20" y="27" font-family="' + "'Courier New',monospace" + '" font-size="12" fill="#c9a84c">You are at: ' + current.name + "</text>" +
        '<text x="20" y="42" font-family="' + "'Courier New',monospace" + '" font-size="10" fill="#8a8a8a">Tap a lit marker to travel</text></g>';

    const legend = [["Town", "#c9a84c"], ["Village", "#2fbf71"], ["Dungeon", "#c0392b"]];
    let lg = '<g><rect x="10" y="316" width="180" height="32" rx="6" fill="#0b0b0c" opacity="0.85"/>';
    legend.forEach((l, i) => {
        lg += '<circle cx="' + (26 + i * 58) + '" cy="332" r="5" fill="' + l[1] + '"/>' +
            '<text x="' + (36 + i * 58) + '" y="336" font-family="' + "'Courier New',monospace" + '" font-size="10" fill="#d6d6d6">' + l[0] + "</text>";
    });
    lg += "</g>";
    svg += lg;

    svg += "</svg>";
    container.innerHTML = svg;
}

function showCreateForm() {
    const d = Game.createForm();
    raceData = d.races;
    classData = d.classes;

    document.getElementById("screen-title").textContent = "CREATE CHARACTER";
    let html = '<div id="create-form">';
    html += '<label>Name</label><input type="text" id="char-name" value="Adventurer">';
    html += '<label>Race</label><select id="char-race" onchange="updateInfoBox()">';
    d.races.forEach(r => html += `<option value="${r[0]}">${r[1]}</option>`);
    html += '</select>';
    html += '<label>Class</label><select id="char-class" onchange="updateInfoBox()">';
    d.classes.forEach(c => html += `<option value="${c[0]}">${c[1]}</option>`);
    html += '</select>';
    html += '<div id="info-box"></div>';
    html += '<button onclick="submitCreate()">Begin Adventure</button>';
    html += '</div>';
    document.getElementById("screen-body").innerHTML = html;
    document.getElementById("options").innerHTML = "";
    document.getElementById("log").innerHTML = "";
    updateInfoBox();
}

function updateInfoBox() {
    const raceSel = document.getElementById("char-race");
    const classSel = document.getElementById("char-class");
    if (!raceSel || !classSel) return;

    const raceIdx = raceSel.selectedIndex;
    const classIdx = classSel.selectedIndex;
    const race = raceData[raceIdx];
    const cls = classData[classIdx];

    let html = '';
    if (race && race[2]) {
        html += `<div><span class="label">Race Bonus:</span> <span class="value">${race[2]}</span></div>`;
    }
    if (cls) {
        html += `<div><span class="label">HP:</span> <span class="value">${cls[2]}</span></div>`;
        html += `<div><span class="label">Primary:</span> <span class="value">${cls[3]}</span></div>`;
    }
    document.getElementById("info-box").innerHTML = html;
}

function submitCreate() {
    const name = document.getElementById("char-name").value || "Adventurer";
    const race = document.getElementById("char-race").value;
    const cls = document.getElementById("char-class").value;
    doStart({name, race, class: cls});
}

// Shows the enemy portrait during combat / on a live dungeon floor.
// The sprite lurches when hit and slowly degrades as its HP drops.
let lastEnemyHp = null;

function renderStage(s) {
    const stage = document.getElementById("combat-stage");
    const enemy = s.enemy;
    const showStage = !!enemy &&
        (s.screen === "combat" || s.screen === "combat_item" || s.screen === "dungeon_floor");

    document.body.classList.toggle("in-combat", !!(showStage || s.in_dungeon));

    if (!showStage) {
        stage.classList.remove("on");
        stage.innerHTML = "";
        lastEnemyHp = null;
        return false;
    }

    const dmg = enemy.max_hp > 0
        ? Math.max(0, Math.min(1, 1 - enemy.hp / enemy.max_hp))
        : 0;
    const hpPct = enemy.max_hp > 0 ? (enemy.hp / enemy.max_hp * 100) : 0;

    stage.classList.add("on");
    stage.innerHTML =
        '<div class="monster" style="--dmg:' + dmg.toFixed(3) + '">' +
            '<div class="monster-art">' + monsterSvg(enemy.name) + "</div>" +
            '<div class="monster-info">' +
                '<div class="monster-name">Lv.' + enemy.level + " " + enemy.name + "</div>" +
                '<div id="ehp-bar"><div id="ehp-fill" style="width:' + hpPct.toFixed(1) + '%"></div></div>' +
                '<div class="monster-hp">HP ' + enemy.hp + "/" + enemy.max_hp + " &nbsp; AC " + enemy.ac + "</div>" +
            "</div>" +
        "</div>";

    if (lastEnemyHp !== null && enemy.hp < lastEnemyHp) {
        const art = stage.querySelector(".monster-art");
        art.classList.add("hit");
        art.addEventListener("animationend", function () { art.classList.remove("hit"); });
    }
    lastEnemyHp = enemy.hp;
    return true;
}

// Rendering
// -----------------------------

let selectedIndex = 0;

function clickOption(index) {
    if (!currentState || !currentState.options || !currentState.options[index]) return;
    selectedIndex = index;
    handleClick(currentState.screen, index);
}

function moveSelection(step) {
    const btns = document.querySelectorAll("#options button[data-opt]");
    if (!btns.length) return;
    selectedIndex = (selectedIndex + step + btns.length) % btns.length;
    btns.forEach(function (b, i) { b.classList.toggle("selected", i === selectedIndex); });
    btns[selectedIndex].scrollIntoView({ block: "nearest" });
}

document.addEventListener("keydown", function (ev) {
    const tag = ev.target && ev.target.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        moveSelection(ev.key === "ArrowDown" ? 1 : -1);
        ev.preventDefault();
        return;
    }
    if (ev.key === "Enter") {
        clickOption(selectedIndex);
        ev.preventDefault();
        return;
    }
    const n = parseInt(ev.key, 10);
    if (n >= 1 && currentState && currentState.options && n <= currentState.options.length) {
        clickOption(n - 1);
    }
});

// -----------------------------
// Shop list with inline item details
// Clicking an item expands a panel under it; "Buy" is always exactly one item
// (no quantity prompt) and the purchase is echoed into the chat log.
// -----------------------------

let openShopItem = null;

function itemStatRows(name) {
    const it = ITEMS[name];
    if (!it) return [];
    const rows = [];

    if (it.category === "weapon") {
        rows.push(["Damage", it.damage_dice + " " + String(it.damage_type).replace(/_/g, " ")]);
        if (it.properties && it.properties.length) {
            rows.push(["Properties", it.properties.join(", ")]);
        }
    } else if (it.category === "armor") {
        const kind = it.armor_type === "shield" ? "shield" : it.armor_type + " armour";
        rows.push(["Armour", it.base_ac + " AC · " + kind]);
    } else {
        rows.push(["Effect", it.description || it.effect || "—"]);
    }

    const bonus = Object.keys(it.stats_bonus || {});
    if (bonus.length) {
        rows.push(["Stat bonus", bonus.map((k) => k + " +" + it.stats_bonus[k]).join(", ")]);
    }
    return rows;
}

// Works out the AC the player would have while wearing `item`, using the same
// formula as Player.calc_ac() so the preview can never lie.
function acPreview(player, item) {
    if (!player || !item) return null;
    const gear = { weapon: player.weapon, armor: player.armor, shield: player.shield };
    if (item.category === "armor") {
        if (item.armor_type === "shield") gear.shield = item;
        else gear.armor = item;
    } else if (item.category === "weapon") {
        gear.weapon = item;
    }

    const bonus = {};
    ["weapon", "armor", "shield"].forEach((slot) => {
        const it = gear[slot];
        if (it) {
            for (const st in it.stats_bonus) bonus[st] = (bonus[st] || 0) + it.stats_bonus[st];
        }
    });
    const dexMod = Math.floor((player.stats.DEX + (bonus.DEX || 0) - 10) / 2);

    let ac;
    if (gear.armor) {
        ac = gear.armor.base_ac;
        if (gear.armor.armor_type === "light") ac += dexMod;
        else if (gear.armor.armor_type === "medium") ac += Math.min(dexMod, 2);
    } else {
        ac = 10 + dexMod;
    }
    if (gear.shield) ac += gear.shield.base_ac;
    return ac;
}

function shopDetailHtml(name, price, player) {
    const it = ITEMS[name];
    const rows = itemStatRows(name);
    let extra = "";

    if (it && player) {
        if (it.category === "armor" || it.category === "weapon") {
            const now = player.ac;
            const then = acPreview(player, it);
            if (then !== null && then !== now) {
                const better = then > now;
                extra += '<p class="flavour">AC ' + now +
                    ' <span class="' + (better ? "good" : "") + '">→ ' + then + "</span>" +
                    (better ? " (+" + (then - now) + ")" : " (" + (then - now) + ")") + "</p>";
            } else {
                extra += '<p class="flavour">AC stays ' + now + "</p>";
            }
        }
    }
    if (it && it.category === "item") {
        extra += '<p class="flavour">Use it from your inventory, or straight from combat.</p>';
    }

    return '<div class="shop-detail-info">' +
        '<div class="shop-detail-name">' + name + " — " + price + "g</div>" +
        "<dl>" + rows.map((r) => "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>").join("") + "</dl>" +
        extra +
        "</div>";
}

function renderOptions(s) {
    const opts = document.getElementById("options");
    opts.innerHTML = "";
    opts.classList.toggle("shop", s.screen === "shop");
    if (selectedIndex >= s.options.length) selectedIndex = 0;

    // The shop draws its own rows so a panel can open under an item.
    if (s.screen === "shop" && s.shop_items) {
        const gold = s.player ? s.player.gold : 0;
        const head = document.createElement("div");
        head.className = "shop-gold";
        head.textContent = "You have " + gold + "g — tap an item to see what it gives you";
        opts.appendChild(head);

        const backIndex = s.options.length - 1;
        s.options.forEach((label, i) => {
            if (i === backIndex) {
                const back = document.createElement("button");
                back.setAttribute("data-opt", i);
                back.textContent = "> " + label;
                back.addEventListener("click", () => { selectedIndex = i; doAction(i); });
                opts.appendChild(back);
                return;
            }
            const name = s.shop_items[i];
            const price = s.shop_prices[i];

            const row = document.createElement("div");
            row.className = "shop-row";

            const btn = document.createElement("button");
            btn.className = "shop-item";
            btn.setAttribute("data-opt", i);
            btn.textContent = "> " + label;
            btn.setAttribute("aria-expanded", openShopItem === i ? "true" : "false");
            btn.addEventListener("click", () => {
                selectedIndex = i;
                toggleShopItem(i);
            });
            row.appendChild(btn);

            if (openShopItem === i) {
                const panel = document.createElement("div");
                panel.className = "shop-detail";
                panel.innerHTML = shopDetailHtml(name, price, s.player);

                const buy = document.createElement("button");
                buy.className = "shop-buy";
                buy.textContent = "Buy · " + price + "g";
                buy.disabled = gold < price;
                buy.title = gold < price ? "Not enough gold" : "Buy one " + name;
                buy.addEventListener("click", (ev) => {
                    ev.stopPropagation();
                    openShopItem = null;
                    doShopBuy(name, 1);   // always exactly one
                });
                panel.appendChild(buy);
                row.appendChild(panel);
            }
            opts.appendChild(row);
        });
        return;
    }

    s.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.setAttribute("data-opt", i);
        btn.textContent = `> ${opt}`;
        btn.classList.toggle("selected", i === selectedIndex);
        btn.addEventListener("click", () => { selectedIndex = i; handleClick(s.screen, i); });
        opts.appendChild(btn);
    });
}

function toggleShopItem(i) {
    openShopItem = (openShopItem === i) ? null : i;
    renderOptions(currentState);
}

function render(s) {
    const prevScreen = currentState ? currentState.screen : null;
    currentState = s;
    if (prevScreen !== s.screen) { selectedIndex = 0; openShopItem = null; }
    document.getElementById("screen-title").textContent = s.title || "";

    const body = document.getElementById("screen-body");
    // Don't overwrite the create form unless we're not in character creation
    if (s.screen !== "character_creation") {
        body.textContent = s.body || "";
    }

    const stageShown = renderStage(s);
    // The portrait already shows the monster's name, HP and AC - drop the
    // duplicate first line so the body just shows the hero.
    if (stageShown && body.textContent) {
        body.textContent = body.textContent.replace(/^[^\n]*\n+/, "");
    }

    renderOptions(s);

    // Log - every message in the batch stays, newest at the bottom
    const log = document.getElementById("log");
    log.innerHTML = "";
    (s.log || []).forEach(msg => {
        const p = document.createElement("p");
        const ts = new Date().toTimeString().slice(0, 8);
        p.textContent = `[${ts}] ${msg}`;
        log.appendChild(p);
    });
    log.scrollTop = log.scrollHeight;

    // Player sidebar
    if (s.player) {
        const p = s.player;
        document.getElementById("p-name").textContent = p.name;
        document.getElementById("p-class").textContent = p.race + " " + p.class;
        document.getElementById("p-level").textContent = p.level;
        document.getElementById("p-hp").textContent = p.hp + "/" + p.max_hp;
        document.getElementById("p-ac").textContent = p.ac;
        document.getElementById("p-gold").textContent = p.gold;
        document.getElementById("p-xp").textContent = p.xp + "/" + p.xp_to_next;
        document.getElementById("p-weapon").textContent = p.weapon;
        document.getElementById("p-armor").textContent = p.armor;

        const hpPct = p.max_hp > 0 ? (p.hp / p.max_hp * 100) : 0;
        document.getElementById("hp-fill").style.width = hpPct + "%";
        const xpPct = p.xp_to_next > 0 ? (p.xp / p.xp_to_next * 100) : 0;
        document.getElementById("xp-fill").style.width = xpPct + "%";
    }
    drawMap(s.current_location);
}

function handleClick(screen, index) {
    if (screen === "main_menu") {
        if (index === 0) showCreateForm();
        else if (index === 1) doLoadList();
    }
    else if (screen === "load_menu") {
        if (index === currentState.options.length - 1) fetchState();
        else doAction(index);
    }
    else if (screen === "town") {
        doAction(index);
    }
    else if (screen === "save_menu") {
        if (index === 0) {
            const name = currentState.options[0].replace("Save as '", "").replace("'", "");
            doSave(name);
        } else {
            doAction(1);
        }
    }
    else if (screen === "confirm_overwrite") {
        if (index === 0) {
            doForceSave();
        } else {
            fetchState();
        }
    }
    else if (screen === "combat" || screen === "combat_item") {
        doAction(index);
    }
    else if (screen === "game_over") {
        fetchState();
    }
    else if (screen === "stat_allocation") {
        doAction(index);
    }
    else if (screen === "shop_select") {
        doAction(index);
    }
    else if (screen === "shop") {
        if (index === currentState.options.length - 1) {
            doAction(index);
        } else {
            showBuy(index);
        }
    }
    else if (screen === "inventory") {
        doAction(index);
    }
    else if (screen === "location") {
        doAction(index);
    }
    else if (screen === "dungeon_floor") {
        doAction(index);
    }
    else if (screen === "dungeon_victory") {
        doAction(index);
    }
    else if (screen === "dungeon") {
        doAction(index);
    }
}

function showBuy(index) {
    buyItemName = currentState.shop_items[index];
    const price = currentState.shop_prices[index];
    document.getElementById("buy-title").textContent = buyItemName;
    document.getElementById("buy-info").textContent = price + " gold each";
    document.getElementById("buy-qty").value = 1;
    document.getElementById("buy-overlay").style.display = "flex";
}

function buyConfirm() {
    const qty = parseInt(document.getElementById("buy-qty").value) || 1;
    if (qty < 1) return;
    doShopBuy(buyItemName, qty);
    hideBuy();
}

function hideBuy() {
    document.getElementById("buy-overlay").style.display = "none";
}

loadMapData();
fetchState();

// Register the service worker so the game can be installed and played offline.
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (err) {
            console.warn("Service worker registration failed:", err);
        });
    });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DND Terminal</title>
    <meta name="description" content="A browser-based Dungeons &amp; Dragons-style RPG with world map, dungeon crawling and turn-based combat.">
    <meta name="theme-color" content="#0b0b0c">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DND Terminal">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b0c;
            color: #d6d6d6;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #app {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        header {
            text-align: center;
            padding: 15px;
            border-bottom: 2px solid #c9a84c;
            margin-bottom: 20px;
        }
        header h1 { color: #c9a84c; font-size: 1.4em; letter-spacing: 3px; }
        #main {
            display: flex;
            gap: 20px;
            flex: 1;
        }
        #left {
            flex: 2;
            display: flex;
            flex-direction: column;
        }
        #right {
            flex: 1;
            background: #151517;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.85em;
            min-width: 220px;
        }
        #right h3 { color: #c9a84c; font-size: 0.9em; margin-bottom: 8px; border-bottom: 1px solid #2e2e33; padding-bottom: 4px; }
        #right p { margin: 4px 0; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
        #right .stat { color: #9a9aa0; }
        #right .val  { color: #d6d6d6; text-align: right; }
        #screen-title {
            color: #c9a84c;
            font-size: 1.2em;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #2e2e33;
        }
        #screen-body {
            white-space: pre-wrap;
            font-size: 0.9em;
            margin-bottom: 15px;
            line-height: 1.5;
            padding: 10px;
            background: #151517;
            border-radius: 6px;
            min-height: 80px;
        }
        #options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #options button {
            background: #1e1e21;
            color: #d6d6d6;
            border: 1px solid #2e2e33;
            padding: 12px 16px;
            min-height: 46px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            cursor: pointer;
            text-align: left;
            border-radius: 4px;
            transition: 0.2s;
            touch-action: manipulation;
        }
        #options button:hover { background: #2a2a2e; border-color: #c9a84c; }
        #options button:active { background: #242428; }
        #options button.selected {
            border-color: #c9a84c;
            background: #2a2a2e;
            box-shadow: inset 4px 0 0 #c9a84c;
        }
        /* ---------- Shop: inline item panel ---------- */
        #options.shop { gap: 4px; }
        .shop-gold {
            color: #c9a84c; font-size: 0.85em; padding: 2px 4px 8px;
            border-bottom: 1px solid #2e2e33; margin-bottom: 6px;
        }
        .shop-row { display: flex; flex-direction: column; }
        .shop-item { width: 100%; }
        .shop-item:disabled { color: #6a6a70; cursor: not-allowed; }
/* Another class's armory. The row still opens so you can read the stats -
   you just cannot buy it, and the panel says why instead of showing a price
   you will never be charged. */
.shop-item.locked { color: #5c5c64; }
.shop-item.locked:hover { background: #1a1a1e; color: #5c5c64; }
.shop-locked-note {
    color: #a35a4a;
    font-size: 0.78em;
    padding: 0 0 4px 22px;
    font-style: italic;
}
.shop-npc-note {
    color: #9a9a9a;
    font-size: 0.85em;
    margin-bottom: 6px;
    font-style: italic;
}
        .shop-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
        .shop-tab {
            flex: 1; background: #1e1e21; color: #8a8a8a; border: 1px solid #2e2e33;
            padding: 9px; font-family: 'Courier New', monospace; font-size: 0.95em;
            cursor: pointer; border-radius: 4px; transition: 0.2s; touch-action: manipulation;
        }
        .shop-tab.active { background: #c9a84c; color: #0b0b0c; border-color: #c9a84c; }
        .shop-sell {
            margin: 4px 0 4px 4px; align-self: flex-start;
            background: #1e1e21; color: #2fbf71; border: 1px solid #2fbf71;
            padding: 9px 18px; min-height: 40px; font-family: 'Courier New', monospace;
            font-size: 0.9em; cursor: pointer; border-radius: 4px; transition: 0.2s;
            touch-action: manipulation;
        }
        .shop-sell:hover { background: #2fbf71; color: #0b0b0c; }
        .shop-detail {
            background: #151517;
            border: 1px solid #2e2e33;
            border-left: 3px solid #c9a84c;
            border-radius: 0 6px 6px 0;
            padding: 12px 14px;
            margin: -2px 0 6px 4px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .shop-detail-info { flex: 1; min-width: 150px; }
        .shop-detail-name { color: #c9a84c; margin-bottom: 6px; }
        .shop-detail dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
        .shop-detail dt { color: #8a8a8a; font-size: 0.85em; }
        .shop-detail dd { margin: 0; color: #d6d6d6; font-size: 0.85em; }
        .shop-detail .good { color: #5fd39a; }
        .shop-detail .flavour { color: #8a8a8a; font-size: 0.8em; margin: 6px 0 0; }
        .shop-buy {
            background: #c9a84c; color: #0b0b0c; border: none;
            padding: 10px 22px; font-family: 'Courier New', monospace; font-size: 0.95em;
            cursor: pointer; border-radius: 4px; min-height: 42px;
            transition: 0.2s; touch-action: manipulation;
            align-self: flex-end;
        }
        .shop-buy:hover { background: #dbb95c; }
        .shop-buy:disabled { background: #2e2e33; color: #8a8a8a; cursor: not-allowed; }
        /* ---------- Quantity stepper (potions only) ---------- */
        .shop-qty {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
            margin-top: 10px; width: 100%;
        }
        .shop-qty-label { color: #8a8a8a; font-size: 0.8em; }
        .qty-btn {
            background: #1e1e21; color: #d6d6d6; border: 1px solid #2e2e33;
            padding: 8px 12px; min-height: 38px; font-family: 'Courier New', monospace;
            font-size: 0.9em; cursor: pointer; border-radius: 4px; transition: 0.15s;
            touch-action: manipulation;
        }
        .qty-btn:hover { border-color: #c9a84c; }
        .qty-btn.active { background: #c9a84c; color: #0b0b0c; border-color: #c9a84c; }
        .qty-total { color: #c9a84c; font-size: 0.85em; margin-left: auto; }
        .qty-total.short { color: #e74c3c; }

        /* ---------- Back button, top left ---------- */
        #topbar {
            display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px;
        }
        #topbar #screen-title { flex: 1; margin-bottom: 0; }
        #back-btn {
            display: none;
            background: #1e1e21; color: #c9a84c; border: 1px solid #c9a84c;
            padding: 9px 14px; min-height: 40px; font-family: 'Courier New', monospace;
            font-size: 0.85em; cursor: pointer; border-radius: 4px;
            transition: 0.2s; touch-action: manipulation; flex: 0 0 auto;
            white-space: nowrap;
        }
        #back-btn:hover { background: #c9a84c; color: #0b0b0c; }
        #back-btn.selected { box-shadow: inset 0 -3px 0 #c9a84c; }

        /* ---------- Inventory detail panel (same look as the shop) ---------- */
        #options.inv { gap: 4px; }
        .inv-item { width: 100%; }
        .inv-item:disabled { color: #6a6a70; cursor: not-allowed; }
        .inv-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .inv-blocked { color: #e74c3c; font-size: 0.8em; margin-top: 8px; }

        /* ---------- Combat item list ---------- */
        .combat-item-disabled { color: #6a6a70; }

        /* ---------- Dice tray: shows the pending rolls ---------- */
        #dice-tray {
            display: none;
            background: linear-gradient(180deg, #1a1a1d, #121214);
            border: 1px solid #3a3a42;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 15px;
            box-shadow: 0 4px 18px rgba(0,0,0,.45);
        }
        #dice-tray.on { display: block; }
        .dice-tray-title {
            color: #c9a84c; font-size: 0.75em; letter-spacing: 2px;
            text-transform: uppercase; margin-bottom: 4px;
        }
        .dice-tray-sub { color: #6a6a70; font-size: 0.75em; margin-bottom: 12px; }
        .dice-row {
            display: flex; align-items: center; gap: 14px;
            padding: 10px; border-top: 1px solid #242428;
        }
        .dice-row:first-of-type { border-top: none; }
        .dice-row.offhand { background: rgba(201,168,76,.05); border-radius: 6px; }
        .dice-group { display: flex; gap: 7px; align-items: center; flex: 0 0 auto; }
        /* Perspective is what sells the tumble: the die spins in 3D rather than
           merely rotating flat, so it reads as an object and not a spinner. */
        .dice-stage { perspective: 320px; display: flex; gap: 8px; align-items: center; }
        .die {
            width: 38px; height: 38px; border-radius: 8px;
            background: radial-gradient(circle at 32% 28%, #fffdf6, #ddd6c2 70%);
            border: 1px solid #a9a08a;
            display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 5px; gap: 1px;
            box-shadow: 0 3px 0 #8b8270, 0 5px 10px rgba(0,0,0,.5);
            transition: transform .18s ease-out;
        }
        .die .pip {
            width: 5px; height: 5px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #4a4a52, #101013);
        }
        .die .pip.off { background: transparent; }
        .die.d20 {
            width: 46px; height: 46px; border-radius: 50%;
            display: grid; place-items: center; padding: 0;
            color: #14141a; font-size: 15px; font-weight: bold;
            font-family: 'Courier New', monospace;
            box-shadow: 0 3px 0 #8b8270, 0 5px 12px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.45);
        }
        /* The tumble: several wild rotations on two axes, then a settle. */
        .die.spinning { animation: die-spin .62s cubic-bezier(.3,.1,.4,1) both; }
        @keyframes die-spin {
            0%   { transform: rotateX(0deg) rotateY(0deg) scale(1); }
            20%  { transform: rotateX(320deg) rotateY(280deg) scale(1.3); }
            45%  { transform: rotateX(700deg) rotateY(540deg) scale(1.15); }
            70%  { transform: rotateX(1010deg) rotateY(900deg) scale(.92); }
            88%  { transform: rotateX(1480deg) rotateY(1240deg) scale(1.06); }
            100% { transform: rotateX(1800deg) rotateY(1440deg) scale(1); }
        }
        .die.landed { animation: die-land .28s ease-out both; }
        @keyframes die-land {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.18); }
            100% { transform: scale(1); }
        }
        .die.miss { background: radial-gradient(circle at 32% 28%, #8a8a92, #55555c 70%); color: #e8e8ee; }
        .dmg-total {
            min-width: 46px; text-align: center; color: #e74c3c;
            font-size: 1.15em; font-weight: bold; opacity: 0;
            font-family: 'Courier New', monospace;
        }
        .dmg-total.show { animation: dmg-pop .45s ease-out both; }
        @keyframes dmg-pop {
            0%   { opacity: 0; transform: scale(.6); }
            35%  { opacity: 1; transform: scale(1.25); }
            100% { opacity: 1; transform: scale(1); }
        }
        .dice-info { flex: 1; min-width: 140px; }
        .dice-label { color: #d6d6d6; font-size: 0.92em; }
        .dice-label .off-tag {
            color: #0b0b0c; background: #c9a84c; padding: 1px 6px;
            border-radius: 3px; font-size: 0.78em; margin-right: 5px;
        }
        .dice-formula { color: #7a7a82; font-size: 0.78em; margin-top: 3px; }
        .roll-btn {
            background: linear-gradient(180deg, #dbb95c, #c9a84c);
            color: #0b0b0c; border: none;
            padding: 11px 30px; font-family: 'Courier New', monospace;
            font-size: 1em; font-weight: bold; letter-spacing: 1px;
            cursor: pointer; border-radius: 5px; min-height: 46px;
            box-shadow: 0 3px 0 #8b7630;
            transition: 0.12s; touch-action: manipulation; flex: 0 0 auto;
        }
        .roll-btn:hover { background: linear-gradient(180deg, #e8c96e, #dbb95c); }
        .roll-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #8b7630; }
        .roll-btn:disabled { background: #2e2e33; color: #6a6a70; box-shadow: none; cursor: wait; }

        /* ---------- Floating damage numbers over the monster ---------- */
        #dmg-layer {
            position: absolute; inset: 0; pointer-events: none; overflow: visible;
        }
        .dmg-float {
            position: absolute; left: 60px; top: 24px;
            color: #ff5b4a; font-weight: bold; font-size: 1.5em;
            text-shadow: 0 2px 4px #000, 0 0 10px rgba(255,60,40,.6);
            font-family: 'Courier New', monospace;
            animation: dmg-rise 1.25s ease-out forwards;
        }
        .dmg-float.weak { color: #ffd633; text-shadow: 0 2px 4px #000, 0 0 12px rgba(255,214,51,.8); }
        @keyframes dmg-rise {
            0%   { opacity: 0; transform: translate(-50%, 6px) scale(.7); }
            18%  { opacity: 1; transform: translate(-50%, -6px) scale(1.15); }
            35%  { transform: translate(-50%, -10px) scale(1); }
            75%  { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -46px) scale(.95); }
        }
        .hint { color: #6a6a70; font-size: 0.72em; margin-top: 8px; text-align: right; }
        #log {
            margin-top: 15px;
            padding: 10px;
            background: #0e0e0f;
            border-radius: 6px;
            font-size: 0.8em;
            color: #8a8a8a;
            min-height: 40px;
            max-height: 100px;
            overflow-y: auto;
        }
        #log p { margin: 2px 0; }
        #log p:first-child { color: #d6d6d6; }
        #map-container {
            margin-top: 15px;
            background: #151517;
            border-radius: 6px;
            padding: 8px;
            width: 100%;
        }
        #map-container svg {
            width: 100%;
            height: auto;
            display: block;
        }
        #create-form { display: flex; flex-direction: column; gap: 12px; padding: 10px 0; }
        #create-form label { color: #9a9aa0; font-size: 0.9em; }
        #create-form input, #create-form select {
            background: #1e1e21; color: #d6d6d6; border: 1px solid #2e2e33;
            padding: 8px 10px; font-family: 'Courier New', monospace; font-size: 0.95em;
            border-radius: 4px; width: 100%;
        }
        #create-form select option { background: #151517; }
        #create-form button {
            background: #c9a84c; color: #0b0b0c; border: none;
            padding: 10px; font-size: 1em; cursor: pointer;
            border-radius: 4px; font-family: 'Courier New', monospace; margin-top: 6px;
        }
        #create-form button:hover { background: #dbb95c; }
        #info-box {
            background: #1e1e21; border: 1px solid #2e2e33; border-radius: 6px;
            padding: 10px; margin-top: 6px; font-size: 0.85em; min-height: 40px;
        }
        #info-box .label { color: #9a9aa0; }
        #info-box .value { color: #d6d6d6; float: right; }
        #hp-bar {
            background: #2e2e33; height: 8px; border-radius: 4px; margin: 6px 0; overflow: hidden;
        }
        #hp-bar div { background: #2fbf71; height: 100%; transition: width 0.3s; }
        #xp-bar {
            background: #2e2e33; height: 6px; border-radius: 3px; margin: 4px 0; overflow: hidden;
        }
        #xp-bar div { background: #c9a84c; height: 100%; transition: width 0.3s; }
        #buy-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center;
        }
        #buy-box {
            background: #151517; padding: 25px; border-radius: 10px;
            border: 1px solid #c9a84c; text-align: center;
            width: 100%; max-width: 92vw;
        }
        #buy-box h3 { color: #c9a84c; margin-bottom: 15px; }
        #buy-box input {
            background: #1e1e21; color: #d6d6d6; border: 1px solid #2e2e33;
            padding: 8px; font-size: 1.1em; width: 80px; text-align: center;
            border-radius: 4px; font-family: 'Courier New', monospace;
        }
        #buy-box button {
            background: #c9a84c; color: #0b0b0c; border: none; padding: 8px 20px;
            margin: 5px; font-size: 0.95em; cursor: pointer; border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        #buy-box button:hover { background: #dbb95c; }

        /* ---------- Safe area (standalone / notched phones) ---------- */
        body { padding-bottom: env(safe-area-inset-bottom); }

        /* ---------- Combat stage: monster portrait ---------- */
        #combat-stage {
            display: none;
            background: #151517;
            border: 1px solid #2e2e33;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 15px;
        }
        #combat-stage.on { display: block; }
        .monster {
            --dmg: 0;
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .monster-art {
            flex: 0 0 auto;
            width: 120px; height: 120px;
            display: grid; place-items: center;
        }
        /* The more damage it has taken, the more twisted and washed out it looks. */
        .monster svg {
            width: 120px; height: 120px; display: block;
            transform:
                rotate(calc(var(--dmg) * 7deg))
                skewX(calc(var(--dmg) * 8deg))
                scale(calc(1 - var(--dmg) * 0.05));
            filter:
                blur(calc(var(--dmg) * 1.3px))
                saturate(calc(1 - var(--dmg) * 0.45))
                hue-rotate(calc(var(--dmg) * 55deg));
            transition: transform .25s ease, filter .25s ease;
        }
        .monster-art.hit { animation: monster-hit .45s ease-out; }
        @keyframes monster-hit {
            0%   { transform: translate(0,0) rotate(0deg); filter: brightness(1); }
            15%  { transform: translate(-11px,4px) rotate(-11deg); filter: brightness(1.9); }
            30%  { transform: translate(10px,-4px) rotate(9deg); filter: brightness(1.25); }
            45%  { transform: translate(-7px,3px) rotate(-6deg); }
            60%  { transform: translate(6px,1px) rotate(5deg); }
            80%  { transform: translate(-3px,0) rotate(-2deg); }
            100% { transform: translate(0,0) rotate(0deg); filter: brightness(1); }
        }
        .monster-info { flex: 1; min-width: 0; }
        /* The layer holding floating damage numbers sits over the portrait. */
        #combat-stage { position: relative; }
        .monster-name { color: #e74c3c; font-size: 1.05em; letter-spacing: 1px; margin-bottom: 8px; }
        #ehp-bar { background: #2a2a2a; height: 12px; border-radius: 6px; overflow: hidden; }
        #ehp-fill {
            background: linear-gradient(90deg, #c0392b, #e74c3c);
            height: 100%; transition: width .3s;
        }
        .monster-hp { color: #9a9aa0; font-size: .8em; margin-top: 6px; }

        /* ---------- Combat / dungeon focus: hide the map, grow the chat ---------- */
        #log { min-height: 40px; max-height: 170px; }
        body.in-combat #map-container { display: none; }
        body.in-combat #log { flex: 1; max-height: none; min-height: 130px; }

        /* ---------- Responsive: phones ---------- */
        @media (max-width: 760px) {
            #app { padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
            header { padding: 10px 4px; margin-bottom: 14px; }
            header h1 { font-size: 1.05em; letter-spacing: 1px; }
            #main { flex-direction: column; gap: 14px; }
            #right {
                order: -1;
                min-width: 0; width: 100%;
                display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 14px;
                padding: 12px;
            }
            #right h3 { grid-column: 1 / -1; }
            #screen-title { font-size: 1.05em; margin-bottom: 8px; }
            #screen-body { font-size: 0.95em; min-height: 60px; }
            #options button { font-size: 1em; padding: 14px; }
            #create-form input, #create-form select, #create-form button { font-size: 1em; padding: 12px; }
            #buy-box { padding: 20px; }
            #combat-stage { padding: 10px; }
            .monster { gap: 12px; }
            .monster-art, .monster svg { width: 92px; height: 92px; }
            .monster-name { font-size: .95em; }
            #log { font-size: 0.82em; }
            .hint { display: none; }
        }
        @media (max-width: 400px) {
            .monster { flex-direction: column; text-align: center; }
            .monster-art, .monster svg { width: 84px; height: 84px; }
        }
        @media (min-width: 1100px) {
            #app { max-width: 1100px; }
        }
    </style>
</head>
<body>
<div id="app">
    <header><h1>⚔ DUNGEONS & DRAGONS ⚔</h1></header>
    <div id="main">
        <div id="left">
            <div id="topbar">
                <button id="back-btn" data-back="1">&larr; Back</button>
                <div id="screen-title"></div>
            </div>
            <div id="dice-tray"></div>
            <div id="combat-stage"></div>
            <div id="screen-body"></div>
            <div id="options"></div>

<script>
let currentState = null;
let buyItemName = null;
let raceData = [];
let classData = [];
let mapLocations = null;


function loadMapData() {
    mapLocations = Game.mapData().locations;
}

function travel(id) {
    render(Game.travel(id));
}

function roadPath(a, b) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const dx = b.x - a.x, dy = b.y - a.y;
    return "M " + a.x + " " + a.y + " Q " + (mx - dy * 0.16) + " " + (my + dx * 0.16) + " " + b.x + " " + b.y;
}

function tree(x, y, s, op) {
    return '<g opacity="' + op + '">' +
        '<rect x="' + (x - 1.4) + '" y="' + (y - 3) + '" width="2.8" height="7" fill="#3a2f1f"/>' +
        '<path d="M ' + x + ' ' + (y - 20 * s) + ' L ' + (x + 9 * s) + ' ' + (y - 1) + ' L ' + (x - 9 * s) + ' ' + (y - 1) + ' Z" fill="#20402e"/>' +
        '<path d="M ' + x + ' ' + (y - 20 * s) + ' L ' + (x + 9 * s) + ' ' + (y - 1) + ' L ' + x + ' ' + (y - 1) + ' Z" fill="#2b5741"/></g>';
}

function mountain(x, y, s, op) {
    return '<g opacity="' + op + '">' +
        '<path d="M ' + (x - 22 * s) + ' ' + y + ' L ' + x + ' ' + (y - 30 * s) + ' L ' + (x + 22 * s) + ' ' + y + ' Z" fill="#242430"/>' +
        '<path d="M ' + (x - 7 * s) + ' ' + (y - 16 * s) + ' L ' + x + ' ' + (y - 30 * s) + ' L ' + (x + 7 * s) + ' ' + (y - 16 * s) + ' Z" fill="#d8d8d6" opacity=".75"/></g>';
}

function nodeGlyph(type) {
    if (type === "town") {
        return '<g fill="#0b0b0c">' +
            '<rect x="-8" y="-4" width="5.5" height="10"/>' +
            '<rect x="2.5" y="-4" width="5.5" height="10"/>' +
            '<rect x="-3" y="-1" width="6" height="7"/>' +
            '<rect x="-9.5" y="-7" width="2" height="3"/><rect x="-6.5" y="-7" width="2" height="3"/>' +
            '<rect x="1.5" y="-7" width="2" height="3"/><rect x="4.5" y="-7" width="2" height="3"/></g>';
    }
    if (type === "village") {
        return '<g fill="#0b0b0c">' +
            '<path d="M 0 -8 L 8 0 L -8 0 Z"/>' +
            '<rect x="-5" y="0" width="10" height="6"/>' +
            '<rect x="-1.4" y="2" width="2.8" height="4" fill="#2fbf71"/></g>';
    }
    return '<g><path d="M -7 6 v-7 a7 7 0 0 1 14 0 v7 Z" fill="#0b0b0c"/>' +
        '<circle cx="-2.6" cy="0" r="1.5" fill="#e74c3c"/><circle cx="2.6" cy="0" r="1.5" fill="#e74c3c"/></g>';
}

function drawMap(currentId) {
    const container = document.getElementById("map-container");
    if (!mapLocations || !currentId || !mapLocations[currentId]) {
        container.innerHTML = "";
        return;
    }
    const locs = mapLocations;
    const current = locs[currentId];
    const FILL = { town: "#c9a84c", village: "#2fbf71", dungeon: "#c0392b" };
    const STROKE = { town: "#dbb95c", village: "#5fd39a", dungeon: "#e74c3c" };
    const reachable = (id) => id === currentId || current.connects_to.indexOf(id) !== -1;

    let svg = '<svg viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="World map">';
    svg += "<style>" +
        ".mn{transition:transform .18s ease;transform-box:fill-box;transform-origin:center}" +
        ".mn:hover{transform:scale(1.18)}" +
        ".mlabel{font-family:'Courier New',monospace;font-size:11px}" +
        "</style>";
    svg += '<defs>' +
        '<linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">' +
            '<stop offset="0" stop-color="#0d0d10"/><stop offset="1" stop-color="#17171c"/></linearGradient>' +
        '<radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">' +
            '<stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>' +
        '<filter id="glow" x="-70%" y="-70%" width="240%" height="240%">' +
            '<feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
        "</defs>";

    svg += '<rect width="520" height="360" fill="url(#sky)" rx="6"/>';

    // --- scenery: hills, forest, river, mountains ---
    svg += '<g opacity="0.5">' +
        '<ellipse cx="150" cy="250" rx="130" ry="60" fill="#151a16"/>' +
        '<ellipse cx="400" cy="120" rx="150" ry="70" fill="#151a16"/>' +
        '<ellipse cx="470" cy="330" rx="120" ry="50" fill="#1c1418"/></g>';

    svg += '<path d="M -12 58 C 70 92, 120 128, 176 196 S 268 292, 352 322 S 470 348, 540 332" ' +
        'stroke="#123b39" stroke-width="15" fill="none" stroke-linecap="round" opacity="0.55"/>' +
        '<path d="M -12 58 C 70 92, 120 128, 176 196 S 268 292, 352 322 S 470 348, 540 332" ' +
        'stroke="#2fbf71" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.28"/>';

    svg += '<g>' +
        tree(300, 300, 0.85, 0.9) + tree(318, 314, 0.7, 0.8) + tree(286, 318, 0.75, 0.8) +
        tree(352, 262, 0.6, 0.7) + tree(268, 268, 0.55, 0.65) +
        tree(402, 92, 0.8, 0.85) + tree(428, 76, 0.65, 0.75) + tree(446, 104, 0.7, 0.8) +
        tree(140, 300, 0.7, 0.7) + tree(120, 258, 0.6, 0.6) +
        "</g>";

    svg += '<g>' +
        mountain(486, 300, 1, 0.95) + mountain(444, 322, 0.75, 0.85) + mountain(516, 286, 0.7, 0.8) +
        mountain(462, 250, 0.55, 0.6) +
        "</g>";

    // --- roads ---
    const drawn = new Set();
    for (const [id, loc] of Object.entries(locs)) {
        for (const target of loc.connects_to) {
            const key = [id, target].sort().join("-");
            if (drawn.has(key)) continue;
            drawn.add(key);
            const t = locs[target];
            if (!t) continue;
            const on = reachable(id) && reachable(target);
            const op = on ? 1 : 0.3;
            svg += '<path d="' + roadPath(loc, t) + '" stroke="#0b0b0c" stroke-width="8" fill="none" opacity="' + (op * 0.7) + '" stroke-linecap="round"/>';
            svg += '<path d="' + roadPath(loc, t) + '" stroke="#c9a84c" stroke-width="2.5" fill="none" opacity="' + op +
                '" stroke-dasharray="2 7" stroke-linecap="round"/>';
        }
    }

    // --- nodes ---
    for (const [id, loc] of Object.entries(locs)) {
        const isCurrent = id === currentId;
        const canReach = reachable(id);
        const op = canReach ? 1 : 0.32;
        const r = isCurrent ? 11 : 9;
        const fill = FILL[loc.type] || "#8a8a8a";
        const stroke = STROKE[loc.type] || "#8a8a8a";
        const labelY = loc.y < 200 ? loc.y - 20 : loc.y + 26;
        const pillW = loc.name.length * 6.7 + 14;
        const clickable = canReach && !isCurrent;

        // One group per node, and only the group carries the click. Previously
        // the visible circle sat on top of the invisible hit area and swallowed
        // the click, so tapping the middle of a marker did nothing while the ring
        // around it worked.
        const attrs = clickable
            ? ` class="mn" style="cursor:pointer" onclick="travel('${id}')"`
            : ` class="mn"`;

        svg += "<g" + attrs + " opacity=\"" + op + '" title="' + (clickable ? "Travel to " : "") + loc.name + '">';

        if (clickable) {
            // generous invisible hit area, easy to tap on a phone
            svg += '<circle cx="' + loc.x + '" cy="' + loc.y + '" r="' + (r + 13) + '" fill="transparent"/>';
        }
        if (isCurrent) {
            svg += '<circle cx="' + loc.x + '" cy="' + loc.y + '" r="' + (r + 4) + '" fill="' + fill + '" opacity="0.18"/>';
        }
        svg += '<circle cx="' + loc.x + '" cy="' + loc.y + '" r="' + r + '" fill="' + fill + '" stroke="' + stroke +
            '" stroke-width="2"' + (isCurrent ? ' filter="url(#glow)"' : "") + "/>";
        svg += '<g transform="translate(' + loc.x + ',' + (loc.y + 0.5) + ') scale(0.62)">' + nodeGlyph(loc.type) + "</g>";
        svg += '<rect x="' + (loc.x - pillW / 2) + '" y="' + (labelY - 11) + '" width="' + pillW + '" height="16" rx="8" fill="#0b0b0c" opacity="0.82"/>';
        svg += '<text class="mlabel" x="' + loc.x + '" y="' + labelY + '" text-anchor="middle" fill="' + stroke + '">' + loc.name + "</text>";
        svg += "</g>";
    }

    // pulsing ring for the current location, drawn under the labels
    const cur = current;
    svg += '<circle cx="' + cur.x + '" cy="' + cur.y + '" r="18" fill="none" stroke="' + (FILL[cur.type] || "#c9a84c") +
        '" stroke-width="2" opacity="0.45" pointer-events="none">' +
        '<animate attributeName="r" values="12;21;12" dur="2.4s" repeatCount="indefinite"/>' +
        '<animate attributeName="opacity" values="0.45;0.05;0.45" dur="2.4s" repeatCount="indefinite"/></circle>';

    svg += '<rect width="520" height="360" fill="url(#vig)" pointer-events="none" rx="6"/>';

    // --- caption + legend ---
    svg += '<g><rect x="10" y="10" width="182" height="40" rx="6" fill="#0b0b0c" opacity="0.8"/>' +
        '<text x="20" y="27" font-family="' + "'Courier New',monospace" + '" font-size="12" fill="#c9a84c">You are at: ' + current.name + "</text>" +
        '<text x="20" y="42" font-family="' + "'Courier New',monospace" + '" font-size="10" fill="#8a8a8a">Tap a lit marker to travel</text></g>';

    const legend = [["Town", "#c9a84c"], ["Village", "#2fbf71"], ["Dungeon", "#c0392b"]];
    let lg = '<g><rect x="10" y="316" width="180" height="32" rx="6" fill="#0b0b0c" opacity="0.85"/>';
    legend.forEach((l, i) => {
        lg += '<circle cx="' + (26 + i * 58) + '" cy="332" r="5" fill="' + l[1] + '"/>' +
            '<text x="' + (36 + i * 58) + '" y="336" font-family="' + "'Courier New',monospace" + '" font-size="10" fill="#d6d6d6">' + l[0] + "</text>";
    });
    lg += "</g>";
    svg += lg;

    svg += "</svg>";
    container.innerHTML = svg;
}

function fetchState() {
    render(Game.getState());
}

function doAction(choice) {
    render(Game.action(choice));
}

function doSave(name) {
    render(Game.save(name));
}

function doForceSave() {
    render(Game.forceSave());
}

function doLoadList() {
    render(Game.loadList());
}

function doStart(data) {
    render(Game.start(data));
}

function doShopBuy(item, qty) {
    render(Game.shopBuy(item, qty));
}

function showCreateForm() {
    const d = Game.createForm();
    raceData = d.races;
    classData = d.classes;

    document.getElementById("screen-title").textContent = "CREATE CHARACTER";
    let html = '<div id="create-form">';
    html += '<label>Name</label><input type="text" id="char-name" value="Adventurer">';
    html += '<label>Race</label><select id="char-race" onchange="updateInfoBox()">';
    d.races.forEach(r => html += `<option value="${r[0]}">${r[1]}</option>`);
    html += '</select>';
    html += '<label>Class</label><select id="char-class" onchange="updateInfoBox()">';
    d.classes.forEach(c => html += `<option value="${c[0]}">${c[1]}</option>`);
    html += '</select>';
    html += '<div id="info-box"></div>';
    html += '<button onclick="submitCreate()">Begin Adventure</button>';
    html += '</div>';
    document.getElementById("screen-body").innerHTML = html;
    document.getElementById("options").innerHTML = "";
    document.getElementById("log").innerHTML = "";
    updateInfoBox();
}

function updateInfoBox() {
    const raceSel = document.getElementById("char-race");
    const classSel = document.getElementById("char-class");
    if (!raceSel || !classSel) return;

    const raceIdx = raceSel.selectedIndex;
    const classIdx = classSel.selectedIndex;
    const race = raceData[raceIdx];
    const cls = classData[classIdx];

    let html = '';
    if (race && race[2]) {
        html += `<div><span class="label">Race Bonus:</span> <span class="value">${race[2]}</span></div>`;
    }
    if (cls) {
        html += `<div><span class="label">HP:</span> <span class="value">${cls[2]}</span></div>`;
        html += `<div><span class="label">Primary:</span> <span class="value">${cls[3]}</span></div>`;
    }
    document.getElementById("info-box").innerHTML = html;
}

function submitCreate() {
    const name = document.getElementById("char-name").value || "Adventurer";
    const race = document.getElementById("char-race").value;
    const cls = document.getElementById("char-class").value;
    doStart({name, race, class: cls});
}

function monsterSvg(name) {
    const art = MONSTER_ART[name] || MONSTER_ART["_default"];
    return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + art + "</svg>";
}

// Shows the enemy portrait during combat / on a live dungeon floor.
// The sprite lurches when hit and slowly degrades as its HP drops.
let lastEnemyHp = null;

function renderStage(s) {
    const stage = document.getElementById("combat-stage");
    const enemy = s.enemy;
    const showStage = !!enemy &&
        (s.screen === "combat" || s.screen === "combat_item" || s.screen === "dungeon_floor");

    document.body.classList.toggle("in-combat", !!(showStage || s.in_dungeon));

    if (!showStage) {
        stage.classList.remove("on");
        stage.innerHTML = "";
        lastEnemyHp = null;
        return false;
    }

    const dmg = enemy.max_hp > 0
        ? Math.max(0, Math.min(1, 1 - enemy.hp / enemy.max_hp))
        : 0;
    const hpPct = enemy.max_hp > 0 ? (enemy.hp / enemy.max_hp * 100) : 0;

    stage.classList.add("on");
    stage.innerHTML =
        '<div class="monster" style="--dmg:' + dmg.toFixed(3) + '">' +
            '<div class="monster-art">' + monsterSvg(enemy.name) + "</div>" +
            '<div class="monster-info">' +
                '<div class="monster-name">Lv.' + enemy.level + " " + enemy.name + "</div>" +
                '<div id="ehp-bar"><div id="ehp-fill" style="width:' + hpPct.toFixed(1) + '%"></div></div>' +
                '<div class="monster-hp">HP ' + enemy.hp + "/" + enemy.max_hp + " &nbsp; AC " + enemy.ac + "</div>" +
            "</div>" +
        "</div>" +
        '<div id="dmg-layer"></div>';

    if (lastEnemyHp !== null && enemy.hp < lastEnemyHp) {
        const art = stage.querySelector(".monster-art");
        art.classList.add("hit");
        art.addEventListener("animationend", function () { art.classList.remove("hit"); });
    }
    lastEnemyHp = enemy.hp;

    // A floating number over the health bar, only when the player actually
    // landed a hit. It fades on its own and is gone by the next exchange, so
    // the number on screen always belongs to the roll that just happened.
    const hit = s.last_damage;
    if (hit && hit.amount > 0) {
        const layer = stage.querySelector("#dmg-layer");
        const float = document.createElement("div");
        float.className = "dmg-float" + (hit.weak ? " weak" : "");
        float.textContent = "-" + hit.amount;
        layer.appendChild(float);
        float.addEventListener("animationend", function () { float.remove(); });
    }
    // Consumed, so re-rendering the same state cannot repeat it.
    gs.last_damage = null;

    return true;
}

// -----------------------------
// Rendering
// -----------------------------

let selectedIndex = 0;

function clickOption(index) {
    if (!currentState || !currentState.options || !currentState.options[index]) return;
    selectedIndex = index;
    handleClick(currentState.screen, index);
}

function moveSelection(step) {
    // The back button lives outside #options but takes part in keyboard nav.
    const btns = document.querySelectorAll("[data-opt]");
    if (!btns.length) return;
    const list = Array.prototype.slice.call(btns);
    const current = list.findIndex((b) => b.classList.contains("selected"));
    const from = current === -1 ? selectedIndex : current;
    const next = (from + step + list.length) % list.length;
    list.forEach((b, i) => { b.classList.toggle("selected", i === next); });
    selectedIndex = Number(list[next].getAttribute("data-opt"));
    list[next].scrollIntoView({ block: "nearest" });
}

document.addEventListener("keydown", function (ev) {
    const tag = ev.target && ev.target.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        moveSelection(ev.key === "ArrowDown" ? 1 : -1);
        ev.preventDefault();
        return;
    }
    if (ev.key === "Enter") {
        clickOption(selectedIndex);
        ev.preventDefault();
        return;
    }
    const n = parseInt(ev.key, 10);
    if (n >= 1 && currentState && currentState.options && n <= currentState.options.length) {
        clickOption(n - 1);
    }
});

// Top-left back button: runs exactly whatever the trailing list entry runs.
document.getElementById("back-btn").addEventListener("click", function () {
    const i = backIndexFor(currentState || { options: [] });
    if (i === -1) return;
    selectedIndex = i;
    openShopItem = null;
    openInvItem = null;
    handleClick(currentState.screen, i);
});

// -----------------------------
// Shop list with inline item details
// Clicking an item expands a panel under it; "Buy" is always exactly one item
// (no quantity prompt) and the purchase is echoed into the chat log.
// -----------------------------

let openShopItem = null;
let shopMode = "buy";          // "buy" | "sell"
let pendingSell = null;        // {item, price, kind} waiting on a confirm

function itemStatRows(name) {
    const it = ITEMS[name];
    if (!it) return [];
    const rows = [];

    if (it.category === "weapon") {
        rows.push(["Damage", it.damage_dice + " " + String(it.damage_type).replace(/_/g, " ")]);
        const heavy = twoHandedBonus(it);
        if (heavy > 0) rows.push(["Two-handed", "+" + heavy + " damage per hit"]);
        const el = ELEMENT_TEXT[elementOf(it)];
        if (el) rows.push(["Element", el]);
        if (it.properties && it.properties.length) {
            rows.push(["Properties", it.properties.join(", ")]);
        }
    } else if (it.category === "armor") {
        const kind = it.armor_type === "shield" ? "shield" : it.armor_type + " armour";
        rows.push(["Armour", it.base_ac + " AC · " + kind]);
    } else {
        rows.push(["Effect", it.description || it.effect || "—"]);
    }

    const who = classTagText(it);
    if (who) rows.push(["Usable by", who]);

    const bonus = Object.keys(it.stats_bonus || {});
    if (bonus.length) {
        rows.push(["Stat bonus", bonus.map((k) => k + " +" + it.stats_bonus[k]).join(", ")]);
    }
    return rows;
}

// Works out the AC the player would have while wearing `item`, using the same
// formula as Player.calc_ac() so the preview can never lie.
function acPreview(player, item) {
    if (!player || !item) return null;
    const gear = { weapon: player.weapon, armor: player.armor, offhand: player.offhand };
    if (item.category === "armor") {
        if (item.armor_type === "shield") gear.offhand = item;
        else gear.armor = item;
    } else if (item.category === "weapon") {
        gear.weapon = item;
        // A two-handed weapon cannot keep a shield, so the preview drops it -
        // otherwise the panel would promise an illegal combination.
        if (isTwoHanded(item)) gear.offhand = null;
    }

    const bonus = {};
    ["weapon", "armor", "offhand"].forEach((slot) => {
        const it = gear[slot];
        if (it) {
            for (const st in it.stats_bonus) bonus[st] = (bonus[st] || 0) + it.stats_bonus[st];
        }
    });
    const dexMod = Math.floor((player.stats.DEX + (bonus.DEX || 0) - 10) / 2);

    let ac;
    if (gear.armor) {
        ac = gear.armor.base_ac;
        if (gear.armor.armor_type === "light") ac += dexMod;
        else if (gear.armor.armor_type === "medium") ac += Math.min(dexMod, 2);
    } else {
        ac = 10 + dexMod;
    }
    if (gear.offhand && gear.offhand.armor_type === "shield") ac += gear.offhand.base_ac;
    return ac;
}

// Plain-language description of each element rider, and who may wield what.
// Both read the catalogue directly, so they cannot drift from the game.
const ELEMENT_TEXT = {
    fire: "rolls to set the target alight, 2 rounds of 1d4 + INT (INT scales the chance)",
    ice: "rolls to freeze the target solid and steal its turn (INT scales the chance)",
    poison: "rolls to poison, 1 DEX per round until it dies (DEX scales the chance)",
    lightning: "rolls to strike, 2 rounds of 1d8 + WIS (WIS scales the chance)",
    dark: "always drains life, 3 rounds of 1d4 + 1 per 15 STR (no chance roll)"
};

function classTagText(it) {
    if (!it || it.category !== "weapon") return null;
    const classes = itemClasses(it);
    return classes.length === ALL_CLASSES.length ? "any class" : classes.join(" or ");
}

function shopDetailHtml(name, price, player, locked, npcClass) {
    const it = ITEMS[name];
    const rows = itemStatRows(name);
    let extra = "";

    // Another class's weapon: show what it is, but never a price or a Buy
    // button, because the request would be refused anyway.
    if (locked) {
        return '<div class="shop-detail-info">' +
            '<div class="shop-detail-name">' + name + "</div>" +
            "<dl>" + rows.map((r) => "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>").join("") + "</dl>" +
            '<p class="flavour" style="color:#a35a4a">' +
            "Not your class's weapon. This is " + (npcClass || "another") + " stock \u2014 visit the " +
            npcClass + "'s own stall, or buy a different weapon here.</p>" +
            "</div>";
    }

    if (it && player) {
        if (it.category === "armor" || it.category === "weapon") {
            const now = player.ac;
            const then = acPreview(player, it);
            if (then !== null && then !== now) {
                const better = then > now;
                extra += '<p class="flavour">AC ' + now +
                    ' <span class="' + (better ? "good" : "") + '">→ ' + then + "</span>" +
                    (better ? " (+" + (then - now) + ")" : " (" + (then - now) + ")") + "</p>";
            } else {
                extra += '<p class="flavour">AC stays ' + now + "</p>";
            }
        }
    }
    if (it && it.category === "item") {
        extra += '<p class="flavour">Use it from your inventory, or straight from combat.</p>';
    }

    return '<div class="shop-detail-info">' +
        '<div class="shop-detail-name">' + name + " — " + price + "g</div>" +
        "<dl>" + rows.map((r) => "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>").join("") + "</dl>" +
        extra +
        "</div>";
}

// -----------------------------
// Shop list: buying, selling, and the last-weapon warning
// -----------------------------

function groupInventoryForSell(p) {
    // Storage only - equipped gear is listed too, but separately flagged.
    const grouped = {};
    p.inventory.forEach((item) => {
        (grouped[item.name] = grouped[item.name] || []).push(item);
    });
    return grouped;
}

// Would selling this leave the player with nothing of its kind?
function isLastOfItsKind(p, item) {
    const slot = item.category === "weapon" ? "weapon"
        : (item.armor_type === "shield" ? "offhand" : "armor");
    const equipped = p[slot] && p[slot].name === item.name;
    const owned = (p.inventory.filter((i) => i.name === item.name).length) + (equipped ? 1 : 0);
    return owned <= 1 && (item.category === "weapon" || item.category === "armor");
}

function sellWarningText(kind) {
    if (kind === "weapon") {
        return "That is your last weapon - you will have nothing equipped!";
    }
    if (kind === "offhand") {
        return "That is your last shield or spare weapon - your off-hand will be empty!";
    }
    return "That is your last piece of armour - you will have nothing equipped!";
}

function renderShopSell(s, opts) {
    // s.player is the JSON view sent to the UI (no inventory); the live Player
    // object lives in gs.player and is what we need for gear and storage.
    const p = gs.player;
    const gold = (s.player && s.player.gold) || (p && p.gold) || 0;
    if (!p) return;
    const grouped = groupInventoryForSell(p);
    const equipped = [];
    ["weapon", "armor", "offhand"].forEach((slot) => {
        const it = p[slot];
        if (it && !grouped[it.name]) equipped.push(it);
    });

    const head = document.createElement("div");
    head.className = "shop-gold";
    head.textContent = "You have " + gold + "g — NPCs pay 20% under the shop price";
    opts.appendChild(head);

    const addRow = (label, price, kind, isEquipped) => {
        if (price === null || price === undefined) {
            const row = document.createElement("div");
            row.className = "shop-row";
            const b = document.createElement("button");
            b.setAttribute("data-opt", opts.querySelectorAll("[data-opt]").length);
            b.className = "shop-item";
            b.textContent = "> " + label + " — cannot be sold";
            b.disabled = true;
            row.appendChild(b);
            opts.appendChild(row);
            return;
        }
        const row = document.createElement("div");
        row.className = "shop-row";

        const btn = document.createElement("button");
        btn.className = "shop-item";
        btn.setAttribute("data-opt", opts.querySelectorAll("[data-opt]").length);
        btn.textContent = "> " + label + (isEquipped ? " (equipped)" : "");
        btn.addEventListener("click", () => {
            if (isLastOfItsKind(p, { category: kind === "weapon" ? "weapon" : "armor",
                                     armor_type: kind === "offhand" ? "shield" : "armor",
                                     name: label })) {
                pendingSell = { item: label, price: price, kind: kind };
                renderOptions(currentState);
            } else {
                doSell(label);
            }
        });
        row.appendChild(btn);

        if (pendingSell && pendingSell.item === label) {
            const warn = document.createElement("div");
            warn.className = "shop-detail";
            warn.innerHTML = '<div class="shop-detail-info">' +
                '<div class="shop-detail-name" style="color:#e74c3c">' +
                    sellWarningText(kind) + "</div>" +
                '<p class="flavour">Selling it leaves that slot empty.</p></div>';

            const cont = document.createElement("button");
            cont.className = "shop-buy";
            cont.textContent = "Continue";
            cont.style.background = "#c0392b";
            cont.addEventListener("click", (ev) => {
                ev.stopPropagation();
                const target = pendingSell;
                pendingSell = null;
                doSell(target.item);
            });
            const cancel = document.createElement("button");
            cancel.className = "shop-buy";
            cancel.textContent = "Cancel";
            cancel.style.background = "#2e2e33";
            cancel.style.color = "#d6d6d6";
            cancel.addEventListener("click", (ev) => {
                ev.stopPropagation();
                pendingSell = null;
                renderOptions(currentState);
            });
            warn.appendChild(cancel);
            warn.appendChild(cont);
            row.appendChild(warn);
        }

        const sellBtn = document.createElement("button");
        sellBtn.className = "shop-sell";
        sellBtn.textContent = "Sell · " + price + "g";
        sellBtn.addEventListener("click", (ev) => { ev.stopPropagation(); doSell(label); });
        row.appendChild(sellBtn);
        opts.appendChild(row);
    };

    equipped.forEach((it) => {
        const kind = it.category === "weapon" ? "weapon"
            : (it.armor_type === "shield" ? "offhand" : "armor");
        addRow(it.name, sellPrice(it.name), kind, true);
    });
    Object.keys(grouped).forEach((name) => {
        const list = grouped[name];
        const it = list[0];
        const kind = it.category === "weapon" ? "weapon"
            : (it.category === "item" ? "item" : (it.armor_type === "shield" ? "offhand" : "armor"));
        const label = list.length > 1 ? name + " x" + list.length : name;
        if (kind === "item") {
            // Quest materials and anything else unsellable; potions are fine.
            const row = document.createElement("div");
            row.className = "shop-row";
            const b = document.createElement("button");
            b.setAttribute("data-opt", opts.querySelectorAll("[data-opt]").length);
            b.className = "shop-item";
            const price = sellPrice(name);
            b.textContent = "> " + label + (price === null ? " — cannot be sold" : "");
            b.disabled = price === null;
            row.appendChild(b);
            if (price !== null) {
                b.addEventListener("click", () => { pendingSell = null; doSell(name); });
                const sellBtn = document.createElement("button");
                sellBtn.className = "shop-sell";
                sellBtn.textContent = "Sell · " + price + "g";
                sellBtn.addEventListener("click", (ev) => { ev.stopPropagation(); doSell(name); });
                row.appendChild(sellBtn);
            }
            opts.appendChild(row);
        } else {
            addRow(label, sellPrice(name), kind, false);
        }
    });

    const back = document.createElement("button");
    back.setAttribute("data-opt", opts.querySelectorAll("[data-opt]").length);
    back.textContent = "> (Back)";
    back.addEventListener("click", () => { pendingSell = null; doAction(0); });
    opts.appendChild(back);
}

function doSell(name) {
    render(Game.sellItem(name));
}

// Everything on a screen, including the shop. index.html owns navigation;
function renderOptions(s) {
    const opts = document.getElementById("options");
    opts.innerHTML = "";
    opts.classList.toggle("shop", s.screen === "shop");
    if (selectedIndex >= s.options.length) selectedIndex = 0;

    // The shop draws its own rows so a panel can open under an item.
    if (s.screen === "shop" && s.shop_items) {
        const gold = s.player ? s.player.gold : 0;

        const tabs = document.createElement("div");
        tabs.className = "shop-tabs";
        const buyTab = document.createElement("button");
        buyTab.className = "shop-tab" + (shopMode === "buy" ? " active" : "");
        buyTab.textContent = "Buy";
        buyTab.addEventListener("click", () => { shopMode = "buy"; pendingSell = null; renderOptions(currentState); });
        const sellTab = document.createElement("button");
        sellTab.className = "shop-tab" + (shopMode === "sell" ? " active" : "");
        sellTab.textContent = "Sell";
        sellTab.addEventListener("click", () => { shopMode = "sell"; pendingSell = null; renderOptions(currentState); });
        tabs.appendChild(buyTab);
        tabs.appendChild(sellTab);
        opts.appendChild(tabs);

        if (shopMode === "sell") {
            renderShopSell(s, opts);
            return;
        }

        // The shop puts the NPC's tagline in `body`; no other shop screen text
        // uses it, so a non-empty body here is always the greeting.
        if (s.body) {
            const note = document.createElement("div");
            note.className = "shop-npc-note";
            note.textContent = s.body;
            opts.appendChild(note);
        }

        const head = document.createElement("div");
        head.className = "shop-gold";
        head.textContent = "You have " + gold + "g — tap an item to see what it gives you";
        opts.appendChild(head);

        const backIndex = backIndexFor(s);
        s.options.forEach((label, i) => {
            // The back entry is drawn in the top-left corner, not down here.
            if (i === backIndex) return;
            const name = s.shop_items[i];
            const price = s.shop_prices[i];
            const isPotionItem = (s.shop_potions || [])[i] === true;
            // Another class's armory. The item is still listed and still opens,
            // so you can compare stats - it just cannot be bought here.
            const locked = (s.shop_usable || [])[i] === false;

            const row = document.createElement("div");
            row.className = "shop-row";

            const btn = document.createElement("button");
            btn.className = "shop-item" + (locked ? " locked" : "");
            btn.setAttribute("data-opt", i);
            btn.textContent = "> " + label;
            if (locked) {
                btn.setAttribute("aria-disabled", "true");
                btn.title = "Not your class's weapon";
            }
            btn.setAttribute("aria-expanded", openShopItem === i ? "true" : "false");
            btn.addEventListener("click", () => {
                selectedIndex = i;
                toggleShopItem(i);
            });
            row.appendChild(btn);

            if (locked) {
                const note = document.createElement("div");
                note.className = "shop-locked-note";
                note.textContent = "Not your class's weapon";
                row.appendChild(note);
            }

            if (openShopItem === i) {
                const panel = document.createElement("div");
                panel.className = "shop-detail";
                panel.innerHTML = shopDetailHtml(name, price, s.player, locked, s.shop_npc_class);

                // Potions stack, so they get a quantity stepper. Everything else
                // is a single tap - you do not buy four longswords at once.
                let qty = 1;
                let stepper = null;
                let buyBtn = null;
                let totalLabel = null;

                const syncBuy = () => {
                    const total = price * qty;
                    buyBtn.textContent = "Buy " + qty + " × · " + total + "g";
                    buyBtn.disabled = gold < total;
                    buyBtn.title = gold < total ? "Not enough gold" : "Buy " + qty + " × " + name;
                    if (totalLabel) {
                        totalLabel.textContent = total + "g total";
                        totalLabel.classList.toggle("short", gold < total);
                    }
                };

                const makeStepper = () => {
                    const box = document.createElement("div");
                    box.className = "shop-qty";
                    const label = document.createElement("span");
                    label.className = "shop-qty-label";
                    label.textContent = "Quantity:";
                    box.appendChild(label);

                    // "Max" is how many the player's gold can cover, capped so the
                    // list stays short on a rich character.
                    const maxAffordable = Math.max(1, Math.min(99, Math.floor(gold / price)));
                    const choices = [1, 5, 10, 20, maxAffordable];
                    const buttons = [];

                    const setQty = (n, btn) => {
                        qty = n;
                        buttons.forEach((b) => b.classList.toggle("active", b === btn));
                        syncBuy();
                    };

                    choices.forEach((n, i) => {
                        const b = document.createElement("button");
                        b.className = "qty-btn";
                        b.textContent = i === choices.length - 1 ? "Max " + n : String(n);
                        b.addEventListener("click", (ev) => { ev.stopPropagation(); setQty(n, b); });
                        box.appendChild(b);
                        buttons.push(b);
                    });
                    setQty(1, buttons[0]);

                    const total = document.createElement("span");
                    total.className = "qty-total";
                    total.textContent = price + "g total";
                    totalLabel = total;
                    box.appendChild(total);
                    return box;
                };

                buyBtn = document.createElement("button");
                buyBtn.className = "shop-buy";
                syncBuy();
                buyBtn.addEventListener("click", (ev) => {
                    ev.stopPropagation();
                    openShopItem = null;
                    doShopBuy(name, qty);
                });

                // A locked item gets its note in shopDetailHtml and no Buy
                // button at all, rather than a button that fails on click.
                if (locked) {
                    // nothing to add
                } else if (isPotionItem) {
                    stepper = makeStepper();
                    panel.appendChild(stepper);
                    panel.appendChild(buyBtn);
                } else {
                    buyBtn.textContent = "Buy · " + price + "g";
                    buyBtn.disabled = gold < price;
                    buyBtn.title = gold < price ? "Not enough gold" : "Buy one " + name;
                    panel.appendChild(buyBtn);
                }
                row.appendChild(panel);
            }
            opts.appendChild(row);
        });
        renderBackButton(s);
        return;
    }

    if (s.screen === "combat_item") {
        renderCombatItems(s, opts);
        renderBackButton(s);
        return;
    }

    if (s.screen === "inventory" && s.inv_items) {
        renderInventoryList(s, opts);
        renderBackButton(s);
        return;
    }

    const backIndex = backIndexFor(s);
    s.options.forEach((opt, i) => {
        if (i === backIndex) return;
        const btn = document.createElement("button");
        btn.setAttribute("data-opt", i);
        btn.textContent = `> ${opt}`;
        btn.classList.toggle("selected", i === selectedIndex);
        btn.addEventListener("click", () => { selectedIndex = i; handleClick(s.screen, i); });
        opts.appendChild(btn);
    });
    renderBackButton(s);
}

// -----------------------------
// Inventory: tap an item, then Equip or Use it
// -----------------------------
// Mirrors the shop panel exactly - selecting an entry never changes anything by
// itself, it just reveals the buttons.

let openInvItem = null;

function renderInventoryList(s, opts) {
    opts.classList.add("inv");
    const p = gs.player;
    if (!p) return;

    const backIndex = backIndexFor(s);
    s.options.forEach((label, i) => {
        if (i === backIndex) return;
        const name = s.inv_items[i];
        const item = getItem(name);
        const isPotionItem = isPotion(name);

        const row = document.createElement("div");
        row.className = "shop-row";

        const btn = document.createElement("button");
        btn.className = "inv-item";
        btn.setAttribute("data-opt", i);
        btn.textContent = "> " + label;
        btn.setAttribute("aria-expanded", openInvItem === i ? "true" : "false");
        btn.addEventListener("click", () => {
            selectedIndex = i;
            openInvItem = (openInvItem === i) ? null : i;
            renderOptions(currentState);
        });
        row.appendChild(btn);

        if (openInvItem === i && item) {
            const panel = document.createElement("div");
            panel.className = "shop-detail";

            let extra = "";
            if (item.category === "weapon" || item.category === "armor") {
                const now = p.ac;
                const then = acPreview(p, item);
                if (then !== null && then !== now) {
                    extra += '<p class="flavour">AC ' + now +
                        ' <span class="' + (then > now ? "good" : "") + '">&rarr; ' + then + "</span></p>";
                }
            }
            const refusal = Game.equipRefusal(name);
            if (refusal) {
                extra += '<p class="inv-blocked">' + refusal + "</p>";
            }
            panel.innerHTML = '<div class="shop-detail-info">' +
                '<div class="shop-detail-name">' + name + "</div>" +
                "<dl>" + itemStatRows(name).map((r) =>
                    "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>").join("") + "</dl>" +
                extra + "</div>";

            const actions = document.createElement("div");
            actions.className = "inv-actions";

            if (item.category === "weapon" || item.category === "armor") {
                const eq = document.createElement("button");
                eq.className = "shop-buy";
                eq.textContent = "Equip";
                eq.disabled = !!refusal;
                eq.addEventListener("click", (ev) => {
                    ev.stopPropagation();
                    openInvItem = null;
                    render(Game.inventoryEquip(name));
                });
                actions.appendChild(eq);
            }
            if (isPotionItem) {
                const use = document.createElement("button");
                use.className = "shop-buy";
                use.textContent = "Use (" + healAmount(name) + " HP)";
                use.style.background = "#2fbf71";
                use.addEventListener("click", (ev) => {
                    ev.stopPropagation();
                    openInvItem = null;
                    render(Game.inventoryUse(name));
                });
                actions.appendChild(use);
            }
            if (!actions.childNodes.length) {
                const none = document.createElement("span");
                none.className = "shop-detail .flavour";
                none.textContent = "Nothing you can do with this yet.";
                actions.appendChild(none);
            }
            panel.appendChild(actions);
            row.appendChild(panel);
        }
        opts.appendChild(row);
    });
}

// -----------------------------
// Combat: every item is listed, but only potions can be used
// -----------------------------
function renderCombatItems(s, opts) {
    const names = s.combat_items || [];
    const backIndex = backIndexFor(s);

    s.options.forEach((label, i) => {
        if (i === backIndex) return;
        const name = names[i];
        const usable = name ? isPotion(name) : false;

        const btn = document.createElement("button");
        btn.setAttribute("data-opt", i);
        btn.className = usable ? "" : "combat-item-disabled";
        btn.textContent = (usable ? "> " : "> ") + label;
        if (!usable) {
            btn.title = "Cannot be used in combat";
        } else {
            btn.addEventListener("click", () => { selectedIndex = i; doAction(i); });
        }
        opts.appendChild(btn);
    });
}

function toggleShopItem(i) {
    openShopItem = (openShopItem === i) ? null : i;
    renderOptions(currentState);
}

// -----------------------------
// Dice tray
// -----------------------------
// On the player's turn the tray shows the dice for each attack they may make
// and a Roll button. The roll itself is decided by the game, not here: the
// animation is theatre, and the authoritative number appears in the combat log
// a moment later. What the tray guarantees is that you can see *what* is about
// to be rolled before you commit the turn.

// Pips for the damage dice: 1-6 fit a 3x3 grid legibly, which is why a d20
// shows its own number instead.
const PIP_LAYOUT = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8]
};

function dieEl(sides, value) {
    const el = document.createElement("div");
    el.className = "die";
    const shown = value ? ((value - 1) % sides) + 1 : 1;
    const on = PIP_LAYOUT[shown] || PIP_LAYOUT[1];
    for (let i = 0; i < 9; i++) {
        const pip = document.createElement("span");
        pip.className = "pip" + (on.indexOf(i) === -1 ? " off" : "");
        el.appendChild(pip);
    }
    return el;
}

function d20El(value) {
    const el = document.createElement("div");
    el.className = "die d20";
    el.textContent = value === null || value === undefined ? "?" : String(value);
    return el;
}

// Counts the dice in a "2d6" string so the tray can show the right number.
function diceParts(expr) {
    const m = /^(\d*)d(\d+)$/.exec(String(expr || "").trim());
    if (!m) return { count: 1, sides: 6, valid: false };
    return { count: parseInt(m[1] || "1", 10), sides: parseInt(m[2], 10), valid: true };
}

function signed(n) {
    return (n >= 0 ? "+" : "") + n;
}

let trayBusy = false;

function renderDiceTray(s) {
    const tray = document.getElementById("dice-tray");
    const attacks = s.attacks || [];
    const show = s.screen === "combat" && attacks.length > 0;

    if (!show) {
        tray.classList.remove("on");
        tray.innerHTML = "";
        return;
    }

    tray.classList.add("on");
    tray.innerHTML = "";

    const title = document.createElement("div");
    title.className = "dice-tray-title";
    title.textContent = "Your turn";
    tray.appendChild(title);

    const sub = document.createElement("div");
    sub.className = "dice-tray-sub";
    sub.textContent = s.enemy
        ? "vs " + s.enemy.name + " " + "·" + " AC " + s.enemy.ac + "  —  roll to attack"
        : "roll to attack";
    tray.appendChild(sub);

    attacks.forEach((atk, i) => {
        const hitParts = diceParts(atk.hit_die);
        const dmgParts = diceParts(atk.damage_die);

        const row = document.createElement("div");
        row.className = "dice-row" + (atk.offhand ? " offhand" : "");

        const stage = document.createElement("div");
        stage.className = "dice-stage";
        stage.appendChild(d20El(null));
        const d20 = stage.lastChild;
        for (let k = 0; k < Math.min(dmgParts.count, 3); k++) stage.appendChild(dieEl(dmgParts.sides, 0));
        row.appendChild(stage);

        const total = document.createElement("span");
        total.className = "dmg-total";
        row.appendChild(total);

        const info = document.createElement("div");
        info.className = "dice-info";
        const label = document.createElement("div");
        label.className = "dice-label";
        if (atk.offhand) {
            label.innerHTML = '<span class="off-tag">OFF-HAND</span>' + escapeHtml(atk.weapon);
        } else {
            label.textContent = atk.weapon;
        }
        const formula = document.createElement("div");
        formula.className = "dice-formula";
        formula.textContent = "to hit " + atk.hit_die + " " + signed(atk.hit_bonus) +
            "  ·  " + (atk.offhand ? "half damage " : "damage ") +
            (dmgParts.valid ? dmgParts.count + "d" + dmgParts.sides : "?") +
            " " + signed(atk.damage_bonus);
        info.appendChild(label);
        info.appendChild(formula);
        row.appendChild(info);

        const roll = document.createElement("button");
        roll.className = "roll-btn";
        roll.textContent = "Roll";
        roll.addEventListener("click", () => doRoll(i));
        row.appendChild(roll);

        tray.appendChild(row);
    });
}

function escapeHtml(text) {
    const d = document.createElement("div");
    d.textContent = String(text);
    return d.innerHTML;
}

// Pulls the numbers back out of the log line the attack just produced, so the
// dice can land on what actually happened rather than on a random face.
//   "... for 12 damage! ... (d20 + 2 + 3 = 17 vs AC 8)"
//   "... missed! (d20 + 2 + 3 = 11 vs AC 8)"
function parseAttackResult(lines) {
    for (let i = lines.length - 1; i >= 0 && i >= lines.length - 4; i--) {
        const line = lines[i] || "";
        const atk = /= (\d+) vs AC/.exec(line);
        if (!atk) continue;
        const dmg = /for (\d+) damage/.exec(line);
        return {
            hitTotal: parseInt(atk[1], 10),
            damage: dmg ? parseInt(dmg[1], 10) : null,
            weak: /WEAK to/.test(line)
        };
    }
    return null;
}

// Spins the dice, resolves the real attack, lands the dice on the true numbers,
// then hands over to the normal render. The delay is short enough not to drag
// and long enough that the result is readable before the log updates.
function doRoll(index) {
    if (trayBusy) return;
    trayBusy = true;

    const tray = document.getElementById("dice-tray");
    const buttons = tray.querySelectorAll(".roll-btn");
    for (let i = 0; i < buttons.length; i++) buttons[i].disabled = true;

    const row = tray.querySelectorAll(".dice-row")[index];
    const d20 = row.querySelector(".die.d20");
    const dice = row.querySelectorAll(".die:not(.d20)");
    const totalEl = row.querySelector(".dmg-total");

    // Wild faces while it spins - these are never shown as a result.
    let ticks = 0;
    const flicker = setInterval(() => {
        ticks++;
        d20.textContent = String(1 + Math.floor(Math.random() * 20));
        dice.forEach((d) => { d.innerHTML = dieEl(6, 1 + Math.floor(Math.random() * 6)).innerHTML; });
        if (ticks >= 6) clearInterval(flicker);
    }, 95);

    const diceEls = [d20].concat(Array.prototype.slice.call(dice));
    diceEls.forEach((d, k) => {
        d.style.animationDelay = (k * 45) + "ms";
        d.classList.add("spinning");
    });

    setTimeout(() => {
        clearInterval(flicker);

        // The game decides the roll; this only reads the answer back out.
        const before = (gs.log || []).length;
        const next = Game.playerAttack(index === 1);
        const added = (gs.log || []).slice(before);
        const result = parseAttackResult(added);

        diceEls.forEach((d) => {
            d.classList.remove("spinning");
            d.classList.add("landed");
        });

        if (result) {
            d20.textContent = result.damage === null ? "MISS" : String(result.hitTotal);
            if (result.damage === null) {
                d20.classList.add("miss");
            } else {
                d20.classList.remove("miss");
                totalEl.textContent = "-" + result.damage;
                totalEl.classList.add("show");
            }
        }

        setTimeout(() => {
            trayBusy = false;
            render(next);
        }, 620);
    }, 660);
}


function render(s) {
    const prevScreen = currentState ? currentState.screen : null;
    currentState = s;
    if (prevScreen !== s.screen) { selectedIndex = 0; openShopItem = null; openInvItem = null; }
    document.getElementById("screen-title").textContent = s.title || "";

    const body = document.getElementById("screen-body");
    // Don't overwrite the create form unless we're not in character creation
    if (s.screen !== "character_creation") {
        body.textContent = s.body || "";
    }

    const stageShown = renderStage(s);
    // The portrait already shows the monster's name, HP and AC - drop the
    // duplicate first line so the body just shows the hero.
    if (stageShown && body.textContent) {
        body.textContent = body.textContent.replace(/^[^\n]*\n+/, "");
    }

    renderOptions(s);
    renderDiceTray(s);

    // Log - every message in the batch stays, newest at the bottom
    const log = document.getElementById("log");
    log.innerHTML = "";
    (s.log || []).forEach(msg => {
        const p = document.createElement("p");
        const ts = new Date().toTimeString().slice(0, 8);
        p.textContent = `[${ts}] ${msg}`;
        log.appendChild(p);
    });
    log.scrollTop = log.scrollHeight;

    // Player sidebar
    if (s.player) {
        const p = s.player;
        document.getElementById("p-name").textContent = p.name;
        document.getElementById("p-class").textContent = p.race + " " + p.class;
        document.getElementById("p-level").textContent = p.level;
        document.getElementById("p-hp").textContent = p.hp + "/" + p.max_hp;
        document.getElementById("p-ac").textContent = p.ac;
        document.getElementById("p-gold").textContent = p.gold;
        document.getElementById("p-xp").textContent = p.xp + "/" + p.xp_to_next;
        document.getElementById("p-weapon").textContent = p.weapon;
        document.getElementById("p-offhand").textContent = p.offhand || "-";
        document.getElementById("p-armor").textContent = p.armor;

        const hpPct = p.max_hp > 0 ? (p.hp / p.max_hp * 100) : 0;
        document.getElementById("hp-fill").style.width = hpPct + "%";
        const xpPct = p.xp_to_next > 0 ? (p.xp / p.xp_to_next * 100) : 0;
        document.getElementById("xp-fill").style.width = xpPct + "%";
    }
    drawMap(s.current_location);
}

function handleClick(screen, index) {
    if (screen === "main_menu") {
        if (index === 0) showCreateForm();
        else if (index === 1) doLoadList();
    }
    else if (screen === "load_menu") {
        if (index === currentState.options.length - 1) fetchState();
        else doAction(index);
    }
    else if (screen === "town") {
        doAction(index);
    }
    else if (screen === "save_menu") {
        if (index === 0) {
            const name = currentState.options[0].replace("Save as '", "").replace("'", "");
            doSave(name);
        } else {
            doAction(1);
        }
    }
    else if (screen === "confirm_overwrite") {
        if (index === 0) {
            doForceSave();
        } else {
            fetchState();
        }
    }
    else if (screen === "combat" || screen === "combat_item") {
        doAction(index);
    }
    else if (screen === "game_over") {
        fetchState();
    }
    else if (screen === "stat_allocation") {
        doAction(index);
    }
    else if (screen === "shop_select") {
        doAction(index);
    }
    else if (screen === "shop") {
        // Keyboard and mouse now do exactly the same thing: both open the
        // inline panel. Only the trailing back entry runs its action.
        if (index === backIndexFor(currentState)) {
            doAction(index);
        } else {
            showBuy(index);
        }
    }
    else if (screen === "inventory") {
        if (index === backIndexFor(currentState)) {
            doAction(index);
        } else {
            doAction(index);   // opens the detail panel client-side
        }
    }
    else if (screen === "location") {
        doAction(index);
    }
    else if (screen === "dungeon_floor") {
        doAction(index);
    }
    else if (screen === "dungeon_victory") {
        doAction(index);
    }
    else if (screen === "dungeon") {
        doAction(index);
    }
    else if (screen === "quest_hub" || screen === "quest_npc") {
        doAction(index);
    }
}

function showBuy(index) {
    // Kept only so a stale keyboard path cannot 404: buying now happens in the
    // inline panel, exactly as it does with the mouse.
    toggleShopItem(index);
}

// -----------------------------
// Back button
// -----------------------------
// The trailing "(Back)" / "(Close)" entry of every list lives in the top-left
// corner instead of at the bottom. It stays in the options array so the
// keyboard still reaches it, but it is no longer drawn in the list.
function backIndexFor(s) {
    if (!s.options || !s.options.length) return -1;
    const last = s.options[s.options.length - 1];
    return /^\((Back|Close)\)/i.test(String(last).trim()) ? s.options.length - 1 : -1;
}

const backBtn = document.getElementById("back-btn");

function renderBackButton(s) {
    const i = backIndexFor(s);
    if (i === -1) {
        backBtn.style.display = "none";
        backBtn.removeAttribute("data-opt");
        return;
    }
    // An explicit value is required here: the stylesheet defaults the button to
    // display:none, so clearing the inline style would leave it hidden.
    backBtn.style.display = "inline-block";
    backBtn.setAttribute("data-opt", i);
    backBtn.classList.toggle("selected", selectedIndex === i);
    const label = String(s.options[i]).trim();
    backBtn.textContent = label.indexOf("Close") === -1 ? "← Back" : "← Close";
}

loadMapData();
fetchState();

// Register the service worker so the game can be installed and played offline.
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (err) {
            console.warn("Service worker registration failed:", err);
        });
    });
}
</script>
